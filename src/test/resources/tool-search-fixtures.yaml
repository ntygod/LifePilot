# 工具搜索召回率回归 fixture（V30 后切到 trigram，全中文 query）。
#
# 每条 query 期望 top-3 中至少有 1 个出现在 expected_top_3 中；
# 整体召回率 ≥ 85% 视为通过。
#
# 注意：
#   - Tier 1 pinned 工具（file.read / file.write / file.list / web.search /
#     web.fetch / shell.exec / memory / knowledge.search / tools.* / skill.load）
#     不在搜索池里，被 ToolSearchService 默认过滤排除 —— 因此 expected 必须是 Tier 2 工具。
#   - trigram tokenizer 对 2 字以上中文短语命中度高，故大多数 query 用 4 字短语。
#   - 失败样本会打印到控制台便于补 tags。
#
fixtures:
  - query: "删除文件"
    expected_top_3: ["file.manage"]
  - query: "复制目录"
    expected_top_3: ["file.manage"]
  - query: "创建文档"
