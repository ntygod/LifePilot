id: "datastore-domain-isolation-a"
name: "Datastore 领域隔离 A"
description: "验证绑定领域 A 时，Agent 优先检索资料并回答 A 领域事实，不混入 B 领域冲突设定。"
category: "domain-isolation"
difficulty: "medium"
userInput: "主角金手指是什么"
expectedToolCalls:
  - "builtin.knowledge.search"
expectedOutputPattern: ".*时间回溯.*"
dimensionWeights:
  toolSelection: 0.35
  parameterValidity: 0.15
  stepEfficiency: 0.15
  policyCompliance: 0.15
  tokenEfficiency: 0.20
timeoutSeconds: 45
mockTools:
  - toolId: "builtin.knowledge.search"
    behaviors:
      - parameterPattern: "主角金手指"
        response: '{"results":[{"chunkId":"chunk-a-1","documentId":"doc-a","content":"主角金手指设定：时间回溯，每次可回退三分钟。","score":0.96,"sourceType":"DATASTORE_DOCUMENT","sourceDatastoreId":"novel-a"}],"count":1}'
        simulateError: false
        delayMs: 0
    defaultResponse: '{"results":[],"count":0}'
initialContext:
  boundDatastore: "novel-a"
  note: "当前会话已绑定 Datastore：novel-a。该领域资料存在与其他领域冲突的同名设定。"
tags:
  - "datastore"
  - "domain-isolation"
  - "smoke"
llmJudgeCriteria: "Agent 应优先调用 builtin.knowledge.search，并基于检索结果回答“时间回溯”。回答中不得混入其他领域的冲突设定，例如“情绪感知”。"
expectedTokenBudget: 18000
expectedStepCount: 3
