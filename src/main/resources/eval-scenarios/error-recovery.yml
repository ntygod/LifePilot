id: "error-recovery"
name: "错误恢复 — 工具调用失败后的重试策略"
description: "测试 Agent 在工具调用失败时的恢复能力，应尝试替代方案而非直接放弃"
category: "error-recovery"
difficulty: "hard"
userInput: "帮我查询今天北京的天气情况"
expectedToolCalls:
  - "weather-query"
dimensionWeights:
  toolSelection: 0.25
  parameterValidity: 0.2
  stepEfficiency: 0.2
  policyCompliance: 0.15
  tokenEfficiency: 0.2
timeoutSeconds: 60
mockTools:
  - toolId: "weather-query"
    behaviors:
      - parameterPattern: "北京"
        response: "服务暂时不可用，请稍后重试"
        simulateError: true
        delayMs: 500
    defaultResponse: '{"error":"未知城市"}'
initialContext:
  role: "生活助手"
  availableTools: "weather-query"
tags:
  - "error-recovery"
  - "resilience"
llmJudgeCriteria: "工具调用失败后，Agent 应向用户说明情况并提供替代方案（如建议稍后重试、提供其他获取天气的方式），而非直接报错或沉默。回复应体现容错和用户友好"
expectedTokenBudget: 20000
expectedStepCount: 3
