id: "long-context-memory"
name: "长上下文 — 多轮对话信息保持"
description: "测试 Agent 在多轮对话中保持上下文信息的能力，应记住之前提到的关键信息"
category: "long-context"
difficulty: "medium"
userInput: "我之前跟你说过我的项目用的是 Vue 3 和 Spring Boot，现在帮我推荐一个适合这个技术栈的部署方案"
expectedToolCalls: []
dimensionWeights:
  toolSelection: 0.1
  parameterValidity: 0.1
  stepEfficiency: 0.25
  policyCompliance: 0.15
  tokenEfficiency: 0.4
