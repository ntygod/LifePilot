  role: "技术顾问"
  previousContext: "用户的项目使用 Vue 3 前端 + Spring Boot 后端，数据库为 SQLite"
tags:
  - "long-context"
  - "memory"
llmJudgeCriteria: "Agent 应基于上下文中提到的技术栈（Vue 3 + Spring Boot + SQLite）给出针对性的部署建议，而非泛泛而谈。回复应明确提及这些技术并给出匹配的部署方案（如 Docker Compose、Nginx 反代等）"
expectedTokenBudget: 20000
expectedStepCount: 2
