# Docker 环境专用配置（通过 SPRING_PROFILES_ACTIVE=docker 激活）
# 所有路径映射到容器内 /data 卷，由 docker-compose.yml 的 zhiwei-data 卷持久化
# 目录管理统一由 ZhiweiPaths Bean 基于 zhiwei.home 派生子目录

zhiwei:
  home: "/data"

spring:
  datasource:
    url: "jdbc:sqlite:${zhiwei.home}/db/zhiwei.db?enable_load_extension=true"

lifepilot:
  memory:
    store:
      vector-db-url: "jdbc:sqlite:${zhiwei.home}/db/vectors.db"
  eval:
    scenario-directory: "/data/eval/scenarios"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
