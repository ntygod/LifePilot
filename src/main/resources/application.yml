spring:
  application:
    name: lifepilot
  datasource:
    url: "jdbc:sqlite:${user.home}/.lifepilot/lifepilot.db"
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

lifepilot:
  agent:
    enabled: true
    loop:
      max-iterations: 50
      scene-mapping:
        understanding: agent-reasoning
        planning: agent-reasoning
        executing: agent-tool-calling
        reflecting: agent-reasoning
        responding: agent-generation
    budget:
      default-max-tokens: 32000
      default-max-steps: 20
      default-max-duration-seconds: 120
      sub-agent-budget-ratio: 0.3
    context:
      max-context-tokens: 32000
      output-reserved-tokens: 4000
    session:
      timeout-minutes: 30
      max-recent-turns: 10
      cleanup-interval-ms: 300000
  llm:
    enabled: true
    providers:
      ollama-qwen2.5:
        type: ollama
        api-url: http://localhost:11434
        model-name: qwen2.5:7b
        timeout-seconds: 60
        priority: 0
        scenes:
          - intent_understanding
          - task_planning
          - knowledge_extraction
          - chat
          - memory_compression
          - proactive_reasoning
          - code_generation
        capabilities: [CHAT, STRUCTURED_OUTPUT, FUNCTION_CALLING, STREAMING]
        enabled: true
        cost-per-input-token: 0
        cost-per-output-token: 0
        max-context-window: 32768
        supports-streaming: true

      ollama-nomic-embed:
        type: ollama
        api-url: http://localhost:11434
        model-name: nomic-embed-text:v1.5
        priority: 0
        scenes: [embedding]
        capabilities: [EMBEDDING]
        enabled: true
        cost-per-input-token: 0
        cost-per-output-token: 0
        max-context-window: 8192
        embedding-dimension: 768

      deepseek-chat:
        type: deepseek
        api-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model-name: deepseek-chat
        priority: 10
        scenes:
          - intent_understanding
          - task_planning
          - knowledge_extraction
          - chat
          - code_generation
          - document_summary
        capabilities: [CHAT, STRUCTURED_OUTPUT, FUNCTION_CALLING, STREAMING]
        enabled: true
        cost-per-input-token: 100
        cost-per-output-token: 200
        max-context-window: 65536

      qwen-plus:
        type: qwen
        api-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${QWEN_API_KEY:}
        model-name: qwen-plus
        priority: 20
        scenes: [chat, task_planning, document_summary]
        capabilities: [CHAT, STRUCTURED_OUTPUT, FUNCTION_CALLING, STREAMING, VISION]
        enabled: true
        cost-per-input-token: 80
        cost-per-output-token: 200
        max-context-window: 131072

    circuit-breaker:
      failure-threshold: 3
      reset-timeout-seconds: 60
      half-open-max-attempts: 1
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
  tool:
    enabled: true
    pipeline:
      default-timeout-seconds: 30
      default-max-retries: 2
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
  memory:
    enabled: true
    working-memory-token-budget: 8000
    idle-session-timeout-minutes: 30
    compression-threshold-tokens: 4000
    consolidation-lookback-days: 7
    forgetting-threshold: 0.7
    max-retention-days: 180
    embedding-dimensions: 1024
    semantic-match-threshold: 0.92
    vector-db-url: "jdbc:sqlite:${user.home}/.lifepilot/vectors.db"
    token-budget:
      system-prompt-ratio: 0.10
      user-message-ratio: 0.15
      high-relevance-working-memory: 40
      high-relevance-retrieval: 35
      long-conversation-working-memory: 60
      long-conversation-retrieval: 15
      default-working-memory: 50
      default-retrieval: 25
      high-relevance-threshold: 0.9
      long-conversation-turns-threshold: 10
  skills:
    enabled: true
    max-concurrent-activations: 5
    directory: "${user.home}/.lifepilot/skills"
    hot-reload-debounce-ms: 500
    auto-generation:
      enabled: true
      gap-threshold: 0.6
    shell-action:
      max-timeout-seconds: 30
    chain-action:
      max-steps: 5
    http-action:
      ssrf-protection-enabled: true
    validation:
      max-name-length: 128
      max-system-prompt-length: 10000
      auto-generated-max-tokens: 10000
      auto-generated-max-steps: 15
      auto-generated-max-timeout: 180
      schema-max-steps: 50
      schema-max-timeout-seconds: 600
    search:
      default-top-k: 10
  knowledge:
    enabled: true
    data-dir: "${user.home}/.lifepilot/data"
    max-file-size: 104857600
    chunking:
      default-strategy: smart
      fixed-size:
        chunk-size: 1024
        min-chunk-size: 100
        overlap-size: 128
        max-chunk-tokens: 512
        respect-sentences: true
  datasource:
    busy-timeout: 5000
  mcp:
    enabled: true
    server:
      enabled: false
    servers: []

logging:
  level:
    root: INFO
    com.lifepilot: DEBUG
