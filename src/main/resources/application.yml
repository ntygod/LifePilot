# 数据根目录，所有持久化数据存放于此（可通过命令行参数 --zhiwei.data-dir=xxx 覆盖）
zhiwei:
  data-dir: "${zhiwei.data-dir}"

spring:
  application:
    name: zhiwei
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: "jdbc:sqlite:${zhiwei.data-dir}/zhiwei.db?enable_load_extension=true"
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    # 当找不到处理器时抛出异常，而不是尝试静态资源处理器
    # 这样可以在 WebExceptionHandler 中统一处理，返回标准的 404 响应
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: ${lifepilot.knowledge.max-file-size}B
      max-request-size: 105MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

lifepilot:
  config-version: 1
  thread-pool:
    # ===== 线程池统一治理配置 =====
    shutdown-timeout-seconds: 10
    shared:
      cleanup-core-pool-size: 1
      debounce-core-pool-size: 1
      heartbeat-core-pool-size: 1
  prompt:
    base-path: "classpath:prompts/"
  agent:
    # ===== Agent 引擎配置 =====
    # AgentLoop 核心控制循环，依赖 LLM Router；LLM 未配置时 AgentLoop 不创建，Web UI 仍可访问
    enabled: true
    debug:
      # 打印每次调用 LLM 时发送的完整提示词（可能包含隐私/密钥），仅建议本地/受控环境开启
      log-llm-prompts: true
    loop:
      # ReAct 循环配置
      max-iterations: 45
      max-consecutive-failures: 3
      max-parallel-tool-calls: 4
      llm-scene: agent_react
    budget:
      default-max-tokens: 20000000
      default-max-steps: 60
      default-max-duration-seconds: 300
    context:
      max-context-tokens: 2000000
      output-reserved-tokens: 8192
      success-step-max-length: 200
      failed-step-max-length: 80
    suspend:
      # 挂起记录最大保留时长
      max-age: 24h
      # 过期清理定时任务间隔
      cleanup-interval: 1h
    checkpoint:
      # 失败检查点最大保留时长
      max-age: 7d
      # 检查点清理定时任务间隔
      cleanup-interval-ms: 3600000
    execution-retry:
      enabled: true
      max-attempts: 2
      initial-delay-ms: 500
      multiplier: 2.0
      max-delay-ms: 5000
    session:
      timeout-minutes: 30
      max-recent-turns: 10
      cleanup-interval-ms: 300000
    task:
      # ===== 自主任务配置（Cron + Heartbeat 双轨） =====
      enabled: true
      heartbeat-enabled: true
      heartbeat-interval-seconds: 1800
      heartbeat-file: "${zhiwei.data-dir}/HEARTBEAT.md"
      execution-timeout-seconds: 300
      # active-hours-start: "08:00"
      # active-hours-end: "22:00"
      max-logs-per-task: 50
    multi-agent:
      enabled: true
      max-delegation-depth: 2
      agent-definitions-path: "${zhiwei.data-dir}/agents/"
      hot-reload:
        enabled: true
        scan-interval-seconds: 5
      budget:
        default-max-tokens: 16000
        default-max-steps: 15
        default-timeout-seconds: 180
      parallel-worker:
        enabled: false
        max-parallel-workers: 5
        worker-budget-ratio: 0.7
  a2a:
    enabled: true
    server:
      enabled: true
      api-key: ${LIFEPILOT_A2A_API_KEY:}
      agent-name: ZhiWei
      agent-description: 个人助手
      agent-version: 1.0.0
      protocol-version: 0.2.5
      streaming-enabled: true
      sse-timeout-seconds: 120
    client:
      enabled: true
      remote-agents: []
      connect-timeout-seconds: 10
      read-timeout-seconds: 60
      card-cache-ttl-minutes: 30
      remote-agent-keys: {}
      circuit-breaker-failure-threshold: 3
      circuit-breaker-reset-timeout-seconds: 60
      circuit-breaker-half-open-max-attempts: 1
    task:
      ttl-minutes: 60
      max-history-length: 50
  llm:
    # ===== LLM 路由配置 =====
    # 生成与向量服务都从 model_services 表加载，通过 Web UI 的“模型与路由”页面统一管理
    # 首次启动后请至少配置一个生成服务；如需知识检索或精排，再分别补充向量与精排服务
    # 如果未配置任何生成服务，系统仍可启动，但对话与推理功能不可用
    enabled: true
    circuit-breaker:
      failure-threshold: 3
      reset-timeout-seconds: 60
      half-open-max-attempts: 1
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
    cache:
      enabled: true
      similarity-threshold: 0.92
      ttl-seconds: 3600
      max-entries: 10000
    connection-pool:
      max-connections: 5
      keep-alive-seconds: 300
  tool:
    enabled: true
    trusted-workspace:
      paths:
        - "${user.home}"
      downgrade-level: LOW
    pipeline:
      default-timeout-seconds: 30
      default-max-retries: 2
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
  memory:
    # ===== 记忆系统配置 =====
    # 四层认知记忆：L1 工作记忆 + L2 情景记忆 + L3 语义记忆 + L4 程序记忆
    # L1/L2 不依赖 LLM，L3/L4 依赖 Embedding（LLM 不可用时自动降级）
    enabled: true
    working-memory-token-budget: 8000
    idle-session-timeout-minutes: 30
    compression-threshold-tokens: 4000
    consolidation-lookback-days: 7
    forgetting-threshold: 0.7
    max-retention-days: 180
    embedding-dimensions: 1024
    semantic-match-threshold: 0.92
    vector-db-url: "jdbc:sqlite:${zhiwei.data-dir}/vectors.db"
    token-budget:
      system-prompt-ratio: 0.10
      user-message-ratio: 0.15
      high-relevance-working-memory: 40
      high-relevance-retrieval: 35
      long-conversation-working-memory: 60
      long-conversation-retrieval: 15
      default-working-memory: 50
      default-retrieval: 25
      high-relevance-threshold: 0.9
      long-conversation-turns-threshold: 10
      # 六区域独立 Token 预算上限
      user-profile-max: 500
      current-session-max: 4000
      cross-session-max: 1000
      knowledge-entity-max: 500
      procedural-max: 300
      knowledge-base-max: 500
    # L4 程序记忆
    procedural:
      max-templates: 200
      min-reliability: 0.7
      min-use-count: 2
      stale-days: 90
      match-threshold: 0.6
      default-importance: 0.5
    # 巩固管线
    consolidation:
      cron: "0 0 3 * * *"
      trigger-mode: CRON
      idle-threshold-minutes: 30
      idle-cooldown-minutes: 60
      lookback-days: 7
      high-frequency-threshold: 3
      importance-boost-step: 0.1
      importance-boost-max: 0.3
      cluster-similarity-threshold: 0.85
      min-cluster-size: 2
      max-templates-per-run: 10
      min-execution-steps: 2
      dedup-cron: "0 30 4 * * *"
      dedup-similarity-threshold: 0.90
      max-dedup-per-run: 50
      short-name-threshold: 2
      experience-promote-min-importance: 0.8
      experience-promote-min-access-count: 3
    # 遗忘引擎
    forgetting:
      cron: "0 0 4 * * SUN"
      max-retention-days: 365
      lru-threshold-days: 90
      priority-decay-rate: 0.02
      priority-decay-threshold: 0.2
      reflection-summary-min-importance: 0.3
      reflection-summary-max-importance: 0.8
      max-forget-per-run: 100
      privacy-aware-boost: 0.3
      protection-threshold: 0.9
      protected-types:
        - PREFERENCE
        - HABIT
        - GOAL
    # AUDN 实体提取
    extraction:
      timeout-seconds: 60
      max-entities-per-extraction: 10
      min-extraction-confidence: 0.3
      max-entity-name-length: 100
      min-description-length: 2
      existing-entity-summary-limit: 50
    # 混合检索相关性过滤
    retrieval:
      min-fused-score: 0.08
      query-max-length: 100
      query-min-length: 10
      min-cross-session-bm25-score: 1.0
      low-quality-score-threshold: 0.3
      low-quality-budget-ratio: 0.5
      max-user-profile-entities: 10
      fallback-user-profile-count: 3
      time-decay-rate: 0.002
      min-time-decay-factor: 0.5
      min-cross-session-semantic-score: 0.45
      query-rewrite-mode: none
      max-rewrites: 3
      rewrite-timeout-ms: 5000
      min-vector-similarity: 0.15
      topic-switch-threshold: 0.3
    # 记忆精排配置
    reranker:
      enabled: true
      top-k: 10
    # 对话压缩配置
    compression:
      strategy: sliding-window
      window-size: 20
      window-overlap: 2
    # 反馈闭环配置
    feedback:
      like-boost: 0.1
      dislike-penalty: 0.05
      expiration-cron: "0 0 * * * *"
    # Agentic Tool 配置
    agentic-tool:
      default-top-k: 10
      docs-default-top-k: 5
    # L2 情景记忆自动清理
    episodic-cleanup:
      cron: "0 0 5 * * *"
      retention-days: 90
      max-cleanup-per-run: 500
    # 经验总结配置
    experience:
      enabled: true
      max-input-tokens: 4000
      dedup-similarity-threshold: 0.90
      max-injection-count: 3
      injection-token-budget: 500
      max-retention-days: 90
      llm-timeout-seconds: 120
      min-tool-success-ratio: 0.3
      eval-integration-enabled: true
      eval-improvement-threshold: 0.05
      eval-tag-prefix: "eval:"
      eval-quality-relax-factor: 0.5
      # 效果反馈配置
      effectiveness:
        success-ratio-threshold: 0.5
        positive-boost: 0.05
        negative-decay: 0.03
        eviction-threshold: 0.1
      # 对比学习配置
      contrastive:
        enabled: true
        similarity-threshold: 0.80
        initial-importance: 0.7
        llm-timeout-seconds: 30
      # 执行上下文隔离配置
      isolation:
        cross-context-retrieval: false
      # 经验合并配置
      merge:
        enabled: true
        similarity-threshold: 0.85
        max-merges-per-run: 10
        llm-timeout-seconds: 30
      # 子任务反思配置
      subtask:
        enabled: true
        min-tool-sequence: 3
        initial-importance: 0.4
        max-input-tokens: 2000
        llm-timeout-seconds: 120
  skills:
    # ===== Skill 系统配置 =====
    # 支持 Java 原生 Skill、Markdown 声明式 Skill、MCP 外部工具
    # LLM 不可用时 Skill 搜索降级为关键词匹配模式
    enabled: true
    max-concurrent-activations: 5
    directory: "${zhiwei.data-dir}/skills"
    hot-reload-debounce-ms: 500
    skill-filename: SKILL.md
    builtin: {}
    auto-generation:
      enabled: true
      gap-threshold: 0.6
      max-cost-cents: 100
      max-validation-iterations: 2
    shell-action:
      max-timeout-seconds: 30
    chain-action:
      max-steps: 5
    http-action:
      ssrf-protection-enabled: true
      timeout-seconds: 30
    validation:
      max-name-length: 128
      max-instructions-length: 10000
      auto-generated-max-tokens: 10000
      auto-generated-max-steps: 15
      auto-generated-max-timeout: 180
      schema-max-steps: 50
      schema-max-timeout-seconds: 600
    search:
      default-top-k: 10
  knowledge:
    enabled: true
    data-dir: "${zhiwei.data-dir}/data"
    max-file-size: 104857600
    chunking:
      default-strategy: smart
      fixed-size:
        chunk-size: 1024
        min-chunk-size: 100
        overlap-size: 128
        max-chunk-tokens: 512
        respect-sentences: true
      recursive:
        separators: ["\n\n", "\n", "。", "！", "？", ".", "!", "?", " "]
        max-chunk-size: 1024
        min-chunk-size: 100
        overlap-size: 128
      heading:
        max-heading-level: 3
        max-chunk-size: 2048
      smart-chunker:
        heading-density-threshold: 0.1
        short-document-threshold: 2000
        code-block-density-threshold: 0.3
        semantic-chunking-threshold: 5000
      semantic-chunking:
        enabled: true
        breakpoint-threshold: 0.5
        buffer-size: 1
        min-chunk-size: 100
        max-chunk-size: 1024
    vector-indexer:
      batch-size: 32
      max-retries: 2
      embedding-dimension: 1024
    retrieval:
      default-top-k: 10
      vector-weight: 0.6
      fts-weight: 0.4
      rrf-k: 60
      low-confidence-threshold: 0.5
      min-relevance-score: 0.0
      context-window-size: 0
    context-enricher:
      enabled: true
      max-prefix-tokens: 100
      batch-enabled: false
      batch-size: 5
      max-prompt-tokens: 4000
    extraction:
      enabled: true
      batch-size: 5
    reranker:
      enabled: false
      type: llm
      model: ""
      top-k: 5
      llm-mode: pointwise
      listwise-max-candidates: 20
      api-provider: jina
      api-key: "${RERANKER_API_KEY:}"
      api-endpoint: ""
      api-timeout-ms: 5000
    query-enhancer:
      mode: rewrite
      timeout-ms: 3000
      max-rewrites: 3
  datasource:
    busy-timeout: 5000
  datastore:
    enabled: true
    max-collections: 100
    max-documents-per-collection: 10000
    max-document-size-bytes: 65536
    default-page-size: 20
    max-page-size: 100
    index-threshold: 100
  gateway:
    # ===== Gateway 中间件管道配置 =====
    # 6 层中间件：Auth → RateLimit → Security → Router → Execution → Audit
    # Channel 适配器（企微/钉钉/飞书）需自行申请对应平台开发者凭证
    enabled: true
    middleware:
      auth:
        enabled: true
        order: 100
      rate-limit:
        enabled: true
        order: 200
      security:
        enabled: true
        order: 300
      router:
        enabled: true
        order: 400
      execution:
        enabled: true
        order: 500
      audit:
        enabled: true
        order: 600
    rate-limit:
      max-requests-per-minute: 30
    security:
      prompt-injection:
        enabled: true
      sensitive-data:
        enabled: true
      trust-score:
        enabled: true
        cache-ttl-minutes: 30
    auth:
      web:
        jwt:
          enabled: false
          expiration-hours: 24
        session:
          enabled: true
          timeout-minutes: 30
    router:
      fast-path-commands:
        - llm
        - mcp
        - skill
    execution:
      timeout-seconds: 6000
      streaming-enabled: true
    audit:
      enabled: true
      request-summary-max-length: 200
      response-summary-max-length: 200
      retention-days: 90
    channels:
      connector-manager:
        enabled: true
        auto-manage-official: true
        host: 127.0.0.1
        port-range-start: 19091
        port-range-end: 19120
        startup-timeout: 45s
        max-attachment-size-bytes: 10485760  # 10MB，单个入站附件最大字节数
      web:
        enabled: true
      wecom:
        enabled: ${WECOM_ENABLED:false}
        corp-id: ${WECOM_CORP_ID:}
        agent-id: ${WECOM_AGENT_ID:}
        secret: ${WECOM_SECRET:}
        token: ${WECOM_TOKEN:}
        encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
      dingtalk:
        enabled: ${DINGTALK_ENABLED:false}
        app-key: ${DINGTALK_APP_KEY:}
        app-secret: ${DINGTALK_APP_SECRET:}
        robot-code: ${DINGTALK_ROBOT_CODE:}
      feishu:
        enabled: ${FEISHU_ENABLED:false}
        app-id: ${FEISHU_APP_ID:}
        app-secret: ${FEISHU_APP_SECRET:}
        verification-token: ${FEISHU_VERIFICATION_TOKEN:}
        encrypt-key: ${FEISHU_ENCRYPT_KEY:}
        event-cache-max-size: 10000
    reconnect:
      max-attempts: 10
      initial-delay-ms: 1000
      max-delay-ms: 60000
      multiplier: 2.0
    session:
      idle-timeout-minutes: 30
      expire-timeout-hours: 24
      cleanup-interval-minutes: 15
    webhook:
      timestamp-tolerance-seconds: 300
      max-retry-count: 3
      retry-interval-seconds: 60
  web:
    sse:
      timeout: 300000
      heartbeat-interval: 30000
      mcp-status-timeout: 1800000
    cors:
      # CORS 跨域配置：开发环境（5173）、Docker 部署（80/同源）和 Tauri 桌面端
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:1420"
        - "http://localhost:80"
        - "http://localhost"
        - "tauri://localhost"
        - "https://tauri.localhost"
        - "http://tauri.localhost"
      allow-credentials: true
  a2ui:
    # A2UI（Agent-to-UI）生成功能配置
    enabled: true
    max-components-per-tree: 50
  media:
    validation:
      parallel-timeout-seconds: 5
    image:
      max-size-bytes: 10485760
      max-dimension: 2048
      jpeg-quality: 0.85
      max-per-request: 5
      process-timeout-seconds: 30
      supported-formats: png,jpeg,gif,webp,bmp
    document:
      max-size-bytes: 52428800
      supported-formats: pdf,docx,doc,md,txt
    audio:
      max-size-bytes: 26214400
      max-duration-seconds: 300
      supported-formats: wav,mp3,ogg,m4a,flac,webm
      whisper-cli-path: auto
      whisper-model: base
      max-recording-seconds: 120
    video:
      max-size-bytes: 524288000
      max-duration-seconds: 1800
      max-key-frames: 120
      supported-formats: mp4,avi,mov,mkv,webm,flv
    tts:
      enabled: true
      voice: alloy
      speed: 1.0
      output-format: mp3
      max-text-length: 4096
    native-audio:
      enabled: true
    native-video:
      enabled: false
      upload-timeout-seconds: 300
      poll-timeout-seconds: 120
      poll-interval-ms: 2000
      max-file-size-bytes: 2147483648
      gemini-api-key: "${GEMINI_API_KEY:}"
      gemini-api-base-url: "https://generativelanguage.googleapis.com"
  marketplace:
    enabled: true
    compatibility-version: "1.0.0"
    index-sources:
      - "https://raw.githubusercontent.com/ntygod/ZhiWei-index/main/index.json"
    cache-ttl-hours: 24
    auto-check-updates: true
    security:
      block-high-risk: false
      injection-patterns:
        - "(?i)ignore\\s+(all\\s+)?previous\\s+instructions?"
        - "(?i)ignore\\s+(all\\s+)?prior"
        - "(?i)disregard\\s+(all\\s+)?(above|previous)"
        - "(?i)forget\\s+(all\\s+)?previous"
    install-dirs:
      skills: "${zhiwei.data-dir}/skills"
      agents: "${zhiwei.data-dir}/agents"
      workflows: "${zhiwei.data-dir}/workflows"
  mcp:
    enabled: true
    server:
      enabled: false
      api-key: ${ZHIWEI_MCP_API_KEY:}
    servers: []
    discovery:
      enabled: true
      paths: []
      seed-builtin-servers: true
  notification:
    # ===== 通知模块配置 =====
    enabled: true
    default-user-id: default
    history-page-size: 20
    max-history-page-size: 100
  workflow:
    # 工作流引擎总开关
    enabled: true
    # 步骤默认超时时间（秒）
    default-step-timeout-seconds: 300
    # 最大并行分支数（ParallelStep）
    max-parallel-branches: 10
    # 最大嵌套深度（SubWorkflowStep）
    max-nesting-depth: 3
    # 最大循环迭代次数（LoopStep）
    max-loop-iterations: 100
    # 工作流 YAML 定义文件目录
    definitions-dir: "${zhiwei.data-dir}/workflows"
    # 崩溃恢复开关
    crash-recovery-enabled: true
    # YAML 文件扫描间隔（秒）
    scan-interval-seconds: 30
    # 是否在启动时释放内置工作流模板到用户目录
    seed-builtin-workflows: true
    # 审批步骤配置
    approval:
      # 默认审批超时时间（秒），24 小时
      default-timeout-seconds: 86400
      # 超时后是否自动批准
      auto-approve-on-timeout: false
    # 事件审计配置
    event-audit:
      # 是否启用事件审计记录
      enabled: true
      # 事件保留天数
      retention-days: 90
    # 步骤重试策略（指数退避）
    retry:
      # 初始延迟（毫秒）
      initial-delay-ms: 500
      # 最大延迟（毫秒）
      max-delay-ms: 5000
      # 最大重试次数
      max-attempts: 3
    # 唤醒调度器配置
    wakeup:
      # 扫描间隔（秒）
      scan-interval-seconds: 10
    # 速率限制配置
    rate-limit:
      # 全局最大并发实例数
      max-concurrent-instances: 20
      # 单个工作流最大并发实例数
      max-instances-per-workflow: 3
  sandbox:
    # 沙箱总开关
    enabled: true
    # 沙箱类型：process / docker
    booter: process
    # 支持的语言列表
    supported-languages:
      - python
      - javascript
      - shell
    # 执行超时（秒）
    execution-timeout-seconds: 30
    # 输出最大字节数
    max-output-bytes: 65536
    # 语言运行时路径
    runtime-paths:
      python: "python"
      javascript: "node"
      shell: "bash"
    # 会话配置
    session:
      # 会话 TTL（秒）
      ttl-seconds: 600
      # 最大活跃会话数
      max-active-sessions: 5
      # 过期清理间隔（秒）
      cleanup-interval-seconds: 60
    # 代码预检配置
    validator:
      # 是否启用预检
      enabled: true
      # 是否拒绝 CRITICAL 级别违规
      reject-critical: true
    # Docker 容器配置
    docker:
      # 内存限制（MB）
      memory-limit-mb: 256
      # CPU 限制（核数）
      cpu-limit: 1.0
      # 是否启用网络
      network-enabled: false
      # 镜像前缀
      image-prefix: "zhiwei/sandbox-"
      dida:
        enabled: false
        base-url: "https://api.dida365.com"
  observability:
    trace:
      enabled: true
      record-prompts: false
      retention-days: 30
      use-scoped-value: true
    guardrail:
      enabled: true
      approval-timeout-seconds: 60
      tool-risk:
        default-risk-level: LOW
        tool-risk-mapping: {}
      content-safety:
        blocked-patterns: []
        sensitive-topics: []
      rate-limit:
        max-calls-per-minute: 60
    redaction:
      enabled: true
      redact-before-llm: true
      redact-in-trace: true
      redact-in-log: true
    evaluation:
      enabled: true
      online-evaluation: true
      tool-selection-weight: 0.30
      parameter-validity-weight: 0.20
      step-efficiency-weight: 0.20
      policy-compliance-weight: 0.20
      token-efficiency-weight: 0.10
      pass-threshold: 0.7
      attention-threshold: 0.5
    metrics:
      enabled: true
      snapshot-interval-seconds: 300
      max-latency-samples: 1000
  eval:
    enabled: true
    scenario-directory: "${zhiwei.data-dir}/eval/scenarios"
    default-pass-threshold: 0.7
    degradation-threshold: 0.1
    llm-judge:
      scene: "eval-judge"
      timeout-seconds: 30
      fallback-score: 0.5
      max-retries: 1
    store:
      default-query-limit: 50
    execution:
      default-timeout-seconds: 60
  # 元能力系统配置
  meta:
    infra:
      max-tool-output-chars: 30000
      web-search:
        provider: tavily
        api-key: ${TAVILY_API_KEY:}
        max-results: 5
        search-depth: basic
        topic: general
        include-answer: true
        connect-timeout-seconds: 10
        read-timeout-seconds: 30
      web-fetch:
        max-content-length: 50000
        timeout-seconds: 10
        min-static-content-length: 100
        render-timeout-seconds: 15
      user-profile:
        timezone: ""
        cache-ttl-seconds: 300
      shell:
        command-blacklist:
          - "rm\\s+-rf\\s+/(?!\\S)"
          - "\\bformat\\s+[a-zA-Z]:"
          - "(?:^|[;&|])\\s*shutdown\\b"
          - "(?:^|[;&|])\\s*reboot\\b"
          - "\\bmkfs\\b"
          - "\\bdd\\s+if="
          - ":\\(\\)\\{\\s*:|:&\\s*\\};:"
          - "\\bchmod\\s+-R\\s+777\\s+/"
        timeout-seconds: 120
        max-output-length: 50000
        yield-ms: 200
        output-read-timeout-seconds: 0  # 0 = 自动计算为 timeout-seconds + 5
        transient-retries: 1
      browser:
        enabled: true
        headless: true
        idle-timeout-seconds: 300
        tool-timeout-seconds: 30
        install-timeout-seconds: 600
        text-snapshot-max-length: 10000
        default-scroll-pixels: 500
        wait-timeout-seconds: 10
        accessibility-max-depth: 5
        js-execution-timeout-seconds: 10
      git:
        enabled: true
        timeout-seconds: 30
        max-diff-lines: 500
        max-log-entries: 50
        max-blame-lines: 200
        max-output-chars: 50000
      code-execute:
        enabled: true
        default-language: python
      file:
        max-read-size: 1048576
        default-max-chars: 30000
        default-max-entries: 200
        allowed-directories: []
        denied-directories:
          - "/etc"
          - "/var"
          - "C:\\Windows"
      file-edit:
        undo-max-depth: 50
        auto-lint: false
        lint-commands:
          ".py": "python3 -m py_compile {file}"
          ".js": "node --check {file}"
        lint-timeout-seconds: 10
        max-snapshot-size-bytes: 5242880
      interaction:
        response-timeout-seconds: 120
      process:
        max-concurrent: 5
        max-output-buffer-size: 100000
        idle-timeout-minutes: 30
      shell-session:
        enabled: true
        max-concurrent-sessions: 5
        ttl-minutes: 30
        default-cols: 120
        default-rows: 40
        history-lines: 2000
        exec-timeout-seconds: 120
        output-max-chars: 50000
        cleanup-interval-seconds: 60
      kernel:
        enabled: true
        max-concurrent-kernels: 3
        ttl-minutes: 30
        cleanup-interval-seconds: 60
        execution-timeout-seconds: 60
        python-runtime: "python3"
        node-runtime: "node"
        max-output-chars: 50000
    introspection:
      cache-ttl-seconds: 60
      debounce-millis: 500
    skill-discovery:
      enabled: true
      skill-paths:
        - skills/find-skills
        - skills/workflow-creator
        - skills/memory
        - skills/infrastructure
        - skills/introspection
        - skills/datastore
        - skills/code-assistant
        - skills/research-assistant
        - skills/content-creator
        - skills/data-analyst
        - skills/browser-automation
        - skills/daily-manager
        - skills/file-organizer
        - skills/summarizer
        - skills/github-workflow
        - skills/translator
        - skills/api-debugger
        - skills/doc-processor
        - skills/project-scaffolder
        - skills/teaching-assistant
        - skills/desktop-automation
    onboarding:
      auto-trigger: true
      agent-definition: preset-agents/onboarding-guide.md

# 日志配置见 logback-spring.xml
