spring:
  application:
    name: lifepilot
  datasource:
    url: "jdbc:sqlite:${user.home}/.lifepilot/lifepilot.db"
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    # 当找不到处理器时抛出异常，而不是尝试静态资源处理器
    # 这样可以在 WebExceptionHandler 中统一处理，返回标准的 404 响应
    throw-exception-if-no-handler-found: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

lifepilot:
  config-version: 1
  agent:
    enabled: true
    loop:
      max-iterations: 50
      max-consecutive-blocks: 3
      scene-mapping:
        understanding: agent-reasoning
        planning: agent-reasoning
        executing: agent-tool-calling
        reflecting: agent-reasoning
        responding: agent-generation
    budget:
      default-max-tokens: 32000
      default-max-steps: 20
      default-max-duration-seconds: 120
      sub-agent-budget-ratio: 0.3
    context:
      max-context-tokens: 32000
      output-reserved-tokens: 4000
    proactive:
      enabled: true
      interval-ms: 1800000
      quiet-hours-start: 22
      quiet-hours-end: 8
      cooldown-minutes: 120
      response-window-minutes: 30
      ignore-threshold: 3
      reduced-multiplier: 3
      max-content-length: 100
    session:
      timeout-minutes: 30
      max-recent-turns: 10
      cleanup-interval-ms: 300000
    multi-agent:
      enabled: true
      max-delegation-depth: 2
      agent-definitions-path: "${user.home}/.lifepilot/agents/"
      register-handoff-tools: true
      hot-reload:
        enabled: true
        scan-interval-seconds: 5
      budget:
        default-max-tokens: 16000
        default-max-steps: 15
        default-timeout-seconds: 180
  a2a:
    enabled: true
    server:
      enabled: true
      api-key: ${LIFEPILOT_A2A_API_KEY:}
      agent-name: LifePilot
      agent-description: 个人生活助手
      agent-version: 1.0.0
      protocol-version: 0.2.5
      streaming-enabled: true
    client:
      enabled: true
      remote-agents: []
      connect-timeout-seconds: 10
      read-timeout-seconds: 60
      card-cache-ttl-minutes: 30
    task:
      ttl-minutes: 60
      max-history-length: 50
  llm:
    enabled: true
    # LLM Provider 配置已迁移到数据库（llm_providers 表）
    # 通过 Web UI 的设置页面或 REST API 进行管理
    circuit-breaker:
      failure-threshold: 3
      reset-timeout-seconds: 60
      half-open-max-attempts: 1
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
  tool:
    enabled: true
    pipeline:
      default-timeout-seconds: 30
      default-max-retries: 2
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
  memory:
    enabled: true
    working-memory-token-budget: 8000
    idle-session-timeout-minutes: 30
    compression-threshold-tokens: 4000
    consolidation-lookback-days: 7
    forgetting-threshold: 0.7
    max-retention-days: 180
    embedding-dimensions: 1024
    semantic-match-threshold: 0.92
    vector-db-url: "jdbc:sqlite:${user.home}/.lifepilot/vectors.db"
    token-budget:
      system-prompt-ratio: 0.10
      user-message-ratio: 0.15
      high-relevance-working-memory: 40
      high-relevance-retrieval: 35
      long-conversation-working-memory: 60
      long-conversation-retrieval: 15
      default-working-memory: 50
      default-retrieval: 25
      high-relevance-threshold: 0.9
      long-conversation-turns-threshold: 10
    # L4 程序记忆
    procedural:
      max-templates: 200
      min-reliability: 0.7
      min-use-count: 2
      stale-days: 90
      match-threshold: 0.6
      default-importance: 0.5
    # 巩固管线
    consolidation:
      cron: "0 0 3 * * *"
      trigger-mode: CRON
      lookback-days: 7
      high-frequency-threshold: 3
      importance-boost-step: 0.1
      importance-boost-max: 0.3
      cluster-similarity-threshold: 0.85
      min-cluster-size: 2
      max-templates-per-run: 10
      min-execution-steps: 2
    # 遗忘引擎
    forgetting:
      cron: "0 0 4 * * SUN"
      max-retention-days: 365
      lru-threshold-days: 90
      priority-decay-rate: 0.02
      priority-decay-threshold: 0.2
      reflection-summary-min-importance: 0.3
      reflection-summary-max-importance: 0.8
      max-forget-per-run: 100
      privacy-aware-boost: 0.3
  skills:
    enabled: true
    max-concurrent-activations: 5
    directory: "${user.home}/.lifepilot/skills"
    hot-reload-debounce-ms: 500
    auto-generation:
      enabled: true
      gap-threshold: 0.6
      max-cost-cents: 100
    shell-action:
      max-timeout-seconds: 30
    chain-action:
      max-steps: 5
    http-action:
      ssrf-protection-enabled: true
      timeout-seconds: 30
    validation:
      max-name-length: 128
      max-system-prompt-length: 10000
      auto-generated-max-tokens: 10000
      auto-generated-max-steps: 15
      auto-generated-max-timeout: 180
      schema-max-steps: 50
      schema-max-timeout-seconds: 600
    search:
      default-top-k: 10
  knowledge:
    enabled: true
    data-dir: "${user.home}/.lifepilot/data"
    max-file-size: 104857600
    chunking:
      default-strategy: smart
      fixed-size:
        chunk-size: 1024
        min-chunk-size: 100
        overlap-size: 128
        max-chunk-tokens: 512
        respect-sentences: true
      recursive:
        separators: ["\n\n", "\n", "。", "！", "？", ".", "!", "?", " "]
        max-chunk-size: 1024
        min-chunk-size: 100
        overlap-size: 128
      heading:
        max-heading-level: 3
        max-chunk-size: 2048
      smart-chunker:
        heading-density-threshold: 0.1
        short-document-threshold: 2000
    vector-indexer:
      batch-size: 32
      max-retries: 2
      embedding-dimension: 1536
    retrieval:
      default-top-k: 10
      vector-weight: 0.6
      fts-weight: 0.4
      rrf-k: 60
    context-enricher:
      enabled: true
      max-prefix-tokens: 100
    extraction:
      enabled: true
      batch-size: 5
    reranker:
      enabled: false
      type: llm
      model: ""
      top-k: 5
  datasource:
    busy-timeout: 5000
  gateway:
    enabled: true
    middleware:
      auth:
        enabled: true
        order: 100
      rate-limit:
        enabled: true
        order: 200
      security:
        enabled: true
        order: 300
      router:
        enabled: true
        order: 400
      execution:
        enabled: true
        order: 500
      audit:
        enabled: true
        order: 600
    rate-limit:
      max-tokens-per-hour: 100000
      max-tokens-per-day: 500000
      estimated-tokens-per-request: 2000
      max-requests-per-minute: 30
    security:
      prompt-injection:
        enabled: true
      sensitive-data:
        enabled: true
      trust-score:
        enabled: true
        cache-ttl-minutes: 30
    auth:
      web:
        jwt:
          enabled: false
          expiration-hours: 24
        session:
          enabled: true
          timeout-minutes: 30
    router:
      fast-path-commands:
        - todo
        - schedule
        - habit
        - llm
        - mcp
        - skill
    execution:
      timeout-seconds: 120
      streaming-enabled: true
    audit:
      enabled: true
      request-summary-max-length: 200
      response-summary-max-length: 200
      retention-days: 90
    channels:
      web:
        enabled: true
      wecom:
        enabled: false
        corp-id:
        agent-id:
        secret:
        token:
        encoding-aes-key:
      dingtalk:
        enabled: false
        app-key:
        app-secret:
        robot-code:
      feishu:
        enabled: false
        app-id:
        app-secret:
        verification-token:
        encrypt-key:
        event-cache-max-size: 10000
    reconnect:
      max-attempts: 10
      initial-delay-ms: 1000
      max-delay-ms: 60000
      multiplier: 2.0
    session:
      idle-timeout-minutes: 30
      expire-timeout-hours: 24
      cleanup-interval-minutes: 15
    webhook:
      timestamp-tolerance-seconds: 300
      max-retry-count: 3
      retry-interval-seconds: 60
  web:
    sse:
      timeout: 300000
      heartbeat-interval: 30000
    cors:
      allowed-origins:
        - "http://localhost:5173"
      allow-credentials: true
  media:
    image:
      max-size-bytes: 10485760
      max-dimension: 2048
      jpeg-quality: 0.85
      max-per-request: 5
      supported-formats: png,jpeg,gif,webp,bmp
    document:
      max-size-bytes: 52428800
      supported-formats: pdf,docx,doc,md,txt
    audio:
      max-size-bytes: 26214400
      max-duration-seconds: 300
      supported-formats: wav,mp3,ogg,m4a,flac,webm
      whisper-cli-path: auto
      whisper-model: base
    video:
      max-size-bytes: 524288000
      max-duration-seconds: 1800
      max-key-frames: 120
      supported-formats: mp4,avi,mov,mkv,webm,flv
    tts:
      voice: alloy
      speed: 1.0
      output-format: mp3
      max-text-length: 4096
  mcp:
    enabled: true
    server:
      enabled: false
    servers: []
  workflow:
    # 工作流引擎总开关
    enabled: true
    # 步骤默认超时时间（秒）
    default-step-timeout-seconds: 300
    # 最大并行分支数（ParallelStep）
    max-parallel-branches: 10
    # 最大嵌套深度（SubWorkflowStep）
    max-nesting-depth: 3
    # 最大循环迭代次数（LoopStep）
    max-loop-iterations: 100
    # 工作流 YAML 定义文件目录
    definitions-dir: "${user.home}/.lifepilot/workflows"
    # 崩溃恢复开关
    crash-recovery-enabled: true
    # YAML 文件扫描间隔（秒）
    scan-interval-seconds: 30
    # 步骤重试策略（指数退避）
    retry:
      # 初始延迟（毫秒）
      initial-delay-ms: 500
      # 最大延迟（毫秒）
      max-delay-ms: 5000
      # 最大重试次数
      max-attempts: 3
  sandbox:
    # 沙箱总开关
    enabled: true
    # 沙箱类型：process / docker
    booter: process
    # 支持的语言列表
    supported-languages:
      - python
      - javascript
      - shell
    # 执行超时（秒）
    execution-timeout-seconds: 30
    # 输出最大字节数
    max-output-bytes: 65536
    # 语言运行时路径
    runtime-paths:
      python: "python3"
      javascript: "node"
      shell: "bash"
    # 会话配置
    session:
      # 会话 TTL（秒）
      ttl-seconds: 600
      # 最大活跃会话数
      max-active-sessions: 5
      # 过期清理间隔（秒）
      cleanup-interval-seconds: 60
    # 代码预检配置
    validator:
      # 是否启用预检
      enabled: true
      # 是否拒绝 CRITICAL 级别违规
      reject-critical: true
    # Docker 容器配置
    docker:
      # 内存限制（MB）
      memory-limit-mb: 256
      # CPU 限制（核数）
      cpu-limit: 1.0
      # 磁盘限制（MB）
      disk-limit-mb: 512
      # 是否启用网络
      network-enabled: false
      # 镜像前缀
      image-prefix: "lifepilot/sandbox-"
  sync:
    # 同步模块总开关
    enabled: true
    # 默认 Cron 表达式（每 15 分钟）
    default-cron: "0 */15 * * * *"
    # 默认冲突解决策略
    default-conflict-policy: LAST_WRITE_WINS
    # 连接器请求超时（秒）
    timeout: 30
    # 最大重试次数
    max-retries: 2
    # 凭证加密密钥来源
    credential-key-source: system-key
    # Obsidian Vault 目录路径
    obsidian-vault-path: ""
    # 事件触发同步最小间隔（秒）
    event-sync-min-interval: 60
    # 连接器配置
    connectors:
      caldav:
        enabled: false
        base-url: ""
        auth-type: basic
      todoist:
        enabled: false
        base-url: "https://api.todoist.com"
      dida:
        enabled: false
        base-url: "https://api.dida365.com"
  observability:
    trace:
      enabled: true
      record-prompts: false
      retention-days: 30
      use-scoped-value: true
    guardrail:
      enabled: true
      tool-risk:
        default-risk-level: LOW
        tool-risk-mapping: {}
      content-safety:
        blocked-patterns: []
        sensitive-topics: []
      budget-limit:
        max-tokens-per-request: 10000
        max-steps-per-request: 20
        max-duration-seconds: 120
        daily-token-limit: 1000000
      rate-limit:
        max-calls-per-minute: 60
        max-calls-per-hour: 1000
    redaction:
      enabled: true
      redact-before-llm: true
      redact-in-trace: true
      redact-in-log: true
    evaluation:
      enabled: true
      online-evaluation: true
      tool-selection-weight: 0.30
      parameter-validity-weight: 0.20
      step-efficiency-weight: 0.20
      policy-compliance-weight: 0.20
      token-efficiency-weight: 0.10
      pass-threshold: 0.7
      attention-threshold: 0.5
    metrics:
      enabled: true
      snapshot-interval-seconds: 300
      max-latency-samples: 1000
  eval:
    enabled: false
    scenario-directory: "${user.home}/.lifepilot/eval/scenarios"
    default-pass-threshold: 0.7
    degradation-threshold: 0.1
    llm-judge:
      scene: "eval-judge"
      timeout-seconds: 30
      fallback-score: 0.5
      max-retries: 1
    store:
      default-query-limit: 50

# 日志配置见 logback-spring.xml（CLI 模式输出到文件，避免干扰 JLine 终端输入）
