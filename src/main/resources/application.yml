# 数据根目录，所有持久化数据存放于此（可通过命令行参数 --zhiwei.home=xxx 覆盖）
# 目录管理统一由 ZhiweiPaths Bean 提供，各模块注入 ZhiweiPaths 获取子目录路径
zhiwei:
  home: "${user.home}/zhiwei"
  workspace: ""

spring:
  application:
    name: zhiwei
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: "jdbc:sqlite:${zhiwei.home}/db/zhiwei.db?enable_load_extension=true"
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    # 当找不到处理器时抛出异常，而不是尝试静态资源处理器
    # 这样可以在 WebExceptionHandler 中统一处理，返回标准的 404 响应
    throw-exception-if-no-handler-found: true
    async:
      # SSE / 长任务异步请求超时 — 关闭 Spring MVC 默认 30 秒 async timeout，
      # 让 SseEmitter 自身 timeout（lifepilot.web.sse.timeout）真正生效。
      # ReAct 多轮工具调用 + 推理模型流式响应可能持续数分钟，30 秒 Tomcat
      # async timeout 会强行打断 SSE 连接 → 前端 stream catch 触发 → 清空已渲染。
      # 设为 -1 表示无限（由 SseEmitter 层独立计时控制），与 sse.timeout 解耦。
      request-timeout: -1
  servlet:
    multipart:
      max-file-size: ${lifepilot.knowledge.max-file-size}B
      max-request-size: 105MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

lifepilot:
  config-version: 1
  thread-pool:
    # ===== 线程池统一治理配置 =====
    shutdown-timeout-seconds: 10
    shared:
      cleanup-core-pool-size: 1
      debounce-core-pool-size: 1
      heartbeat-core-pool-size: 1
  prompt:
    base-path: "classpath:prompts/"
  # ===== 智能层配置 =====
  intelligence:
    enabled: true
    decision-signal-enabled: true
    min-experience-confidence: 0.6
    capability-cache-ttl-seconds: 60
    tool-health-window-size: 20
  # ===== 主动引擎配置 =====
  initiative:
    enabled: true  # 已启用：思考链路（信号→Thinker→ThoughtPool→Gatekeeper）已验证；
                   # 表达/执行（ConversationInitiator/ActionExecutor）尚未接线，不会自主对外发消息
    max-active-thoughts: 20
    brewing-ttl-hours: 72
    ready-ttl-hours: 48
    daily-max-expressions: 3
    min-interval-minutes: 60
    quiet-hours-start: "23:00"
    quiet-hours-end: "08:00"
    idle-thinking-enabled: true
    idle-threshold-minutes: 30
    idle-thinking-max-daily: 4
  agent:
    # ===== Agent 引擎配置 =====
    # AgentLoop 核心控制循环，依赖 LLM Router；LLM 未配置时 AgentLoop 不创建，Web UI 仍可访问
    enabled: true
    debug:
      # 打印每次调用 LLM 时发送的完整提示词（可能包含隐私/密钥），仅建议本地/受控环境开启
      log-llm-prompts: true
    loop:
      # ReAct 循环配置
      max-iterations: 45
      max-consecutive-failures: 3
      max-parallel-tool-calls: 4
      llm-scene: agent_react
      default-temperature: 0.7
      # reflect-after-iterations: 5    # 开始周期性回顾的迭代阈值
      # reflect-interval: 3            # 周期性回顾间隔
      reflect-on-tool-failure: true  # 工具失败时触发回顾
      stall-detection-threshold: 3   # 停滞检测阈值
    budget:
      default-max-tokens: 20000000
      default-max-steps: 60
      default-max-duration-seconds: 1800
    context:
      max-context-tokens: 2000000
      output-reserved-tokens: 8192
      success-step-max-length: 200
      failed-step-max-length: 80
    suspend:
      # 挂起记录最大保留时长
      max-age: 24h
      # 过期清理定时任务间隔
      cleanup-interval: 1h
    checkpoint:
      # 失败检查点最大保留时长
      max-age: 7d
      # 检查点清理定时任务间隔
      cleanup-interval-ms: 3600000
    execution-retry:
      enabled: true
      max-attempts: 2
      initial-delay-ms: 500
      multiplier: 2.0
      max-delay-ms: 5000
    session:
      timeout-minutes: 30
      max-recent-turns: 10
      cleanup-interval-ms: 300000
    task:
      # ===== 自主任务配置（Cron + Heartbeat 双轨） =====
      enabled: true
      heartbeat-enabled: true
      proactive-reminder-enabled: false
      heartbeat-interval-seconds: 1800
      heartbeat-file: "${zhiwei.home}/HEARTBEAT.md"
      execution-timeout-seconds: 300
      # active-hours-start: "08:00"
      # active-hours-end: "22:00"
      max-logs-per-task: 50
    multi-agent:
      enabled: true
      max-delegation-depth: 2
      # agent-definitions-path 由 ZhiweiPaths.home("agents") 提供
      hot-reload:
        enabled: true
        scan-interval-seconds: 5
      budget:
        default-max-tokens: 16000
        default-max-steps: 15
        default-timeout-seconds: 180
      parallel-worker:
        enabled: false
        max-parallel-workers: 5
        worker-budget-ratio: 0.7
  a2a:
    enabled: true
    server:
      enabled: true
      api-key: ${LIFEPILOT_A2A_API_KEY:}
      agent-name: ZhiWei
      agent-description: 个人助手
      agent-version: 1.0.0
      protocol-version: 0.2.5
      streaming-enabled: true
      sse-timeout-seconds: 120
    client:
      enabled: true
      remote-agents: []
      connect-timeout-seconds: 10
      read-timeout-seconds: 60
      card-cache-ttl-minutes: 30
      remote-agent-keys: {}
      circuit-breaker-failure-threshold: 3
      circuit-breaker-reset-timeout-seconds: 60
      circuit-breaker-half-open-max-attempts: 1
    task:
      ttl-minutes: 60
      max-history-length: 50
    # ===== 学习层配置（绑定 lifepilot.agent.learning.*；consolidation-decoupling 从 lifepilot.memory.* 迁入）=====
    learning:
      consolidation:
        # 每日定时阶段（偏好同步 + 经验合并 + 经验提升）
        cron: "0 0 3 * * *"
        trigger-mode: CRON
        # 用户画像巩固防抖窗口（对话结束事件后等待此窗口再触发）
        profile-debounce-minutes: 30
        # 空闲触发 REM 联想
        idle-threshold-minutes: 30
        idle-cooldown-minutes: 60
        lookback-days: 7
        high-frequency-threshold: 3
        importance-boost-step: 0.1
        importance-boost-max: 0.3
        cluster-similarity-threshold: 0.85
        min-cluster-size: 2
        max-templates-per-run: 10
        min-execution-steps: 2
        # 实体去重（EntityDeduplicator 自调度）
        dedup-cron: "0 30 4 * * *"
        dedup-similarity-threshold: 0.90
        max-dedup-per-run: 50
        short-name-threshold: 2
        experience-promote-min-importance: 0.8
        experience-promote-min-access-count: 3
        user-profile-llm-timeout-seconds: 120
      forgetting:
        cron: "0 0 4 * * SUN"
        max-retention-days: 365
        lru-threshold-days: 90
        priority-decay-rate: 0.02
        priority-decay-threshold: 0.2
        reflection-summary-min-importance: 0.3
        reflection-summary-max-importance: 0.8
        max-forget-per-run: 100
        privacy-aware-boost: 0.3
        protection-threshold: 0.9
        protected-types:
          - PREFERENCE
          - HABIT
          - GOAL
      extraction:
        timeout-seconds: 60
        max-entities-per-extraction: 10
        min-extraction-confidence: 0.3
        max-entity-name-length: 100
        min-description-length: 2
        existing-entity-summary-limit: 50
        # 对话期关系抽取（memory-graph-deepening）：实体写入后追加抽取实体间关系写入 memory_relations
        relation-extraction-enabled: true
        relation-timeout-seconds: 60
      # REM 式联想巩固配置（agent.learning.rem）
      rem:
        enabled: true
        seed-limit: 10
        neighbor-limit: 5
        seed-types:
          - GOAL
          - TOPIC
          - PROJECT
        min-confidence: 0.65
        llm-timeout-seconds: 60
        deduplication-window-hours: 24
        # REM 候选落库应用器（memory-graph-deepening）：文件候选 → memory_relations 主库
        apply-enabled: true
        apply-min-confidence: 0.75
      # 经验总结配置（agent.learning.experience；模块拆分前误置于 lifepilot.memory.experience）
      experience:
        enabled: true
        max-input-tokens: 4000
        dedup-similarity-threshold: 0.90
        max-retention-days: 90
        llm-timeout-seconds: 120
        min-tool-success-ratio: 0.3
        effectiveness:
          success-ratio-threshold: 0.5
          positive-boost: 0.05
          negative-decay: 0.03
          eviction-threshold: 0.1
        contrastive:
          enabled: true
          similarity-threshold: 0.80
          initial-importance: 0.7
          llm-timeout-seconds: 120
        isolation:
          cross-context-retrieval: false
        merge:
          enabled: true
          similarity-threshold: 0.85
          max-merges-per-run: 10
          llm-timeout-seconds: 30
        subtask:
          enabled: true
          min-tool-sequence: 3
          initial-importance: 0.4
          max-input-tokens: 2000
          llm-timeout-seconds: 120
      # 反馈闭环配置（agent.learning.feedback；模块拆分前误置于 lifepilot.memory.feedback）
      feedback:
        like-boost: 0.1
        dislike-penalty: 0.05
        expiration-cron: "0 0 * * * *"
        negative-threshold-count: 3
        negative-threshold-score: -1.0
  llm:
    # ===== LLM 路由配置 =====
    # 生成与向量服务都从 model_services 表加载，通过 Web UI 的“模型与路由”页面统一管理
    # 首次启动后请至少配置一个生成服务；如需知识检索或精排，再分别补充向量与精排服务
    # 如果未配置任何生成服务，系统仍可启动，但对话与推理功能不可用
    enabled: true
    circuit-breaker:
      failure-threshold: 3
      reset-timeout-seconds: 60
      half-open-max-attempts: 1
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
    cache:
      enabled: true
      similarity-threshold: 0.92
      ttl-seconds: 3600
      max-entries: 10000
    connection-pool:
      max-connections: 5
      keep-alive-seconds: 300
  tool:
    enabled: true
    pipeline:
      default-timeout-seconds: 30
      default-max-retries: 2
      retry-initial-delay-ms: 500
      retry-multiplier: 2.0
      retry-max-delay-ms: 5000
    # ===== 核心工具常驻，其余工具按需发现 =====
    # 这些工具始终注入 LLM 上下文；其他 Java 原生工具和 MCP 外部工具通过 tool.search 发现后注入。
    tier1:
      pinned:
        - memory
        - file.read
        - status
        - skill.load
        - tool.search
    # ===== 搜索服务 =====
    search:
      default-limit: 5
      max-limit: 20
      bm25-confidence-threshold: 1.0
      cache:
        layer-a-max-size: 500
        layer-b-max-size: 1000
        layer-b-ttl-minutes: 5
      fallback:
        # 向量 fallback 默认关闭，观察 BM25 召回率再决定是否启用
        vector-enabled: false
    # 注：工具使用决策（含 tool.search 链路、PERCEPTION/ACTION 分布提示等）
    # 已全部迁移到 prompts/agent/react-system.st 的 <tool_protocol> 段，不再从 yaml 硬编码。
  memory:
    # ===== 记忆系统配置 =====
    # 分层记忆：L0 transcript 真源 + L1 工作区 + L2 冷召回 + L3 治理主库 + L3.5 热摘要 + L4 程序记忆
    # L3 主库不依赖 LLM；向量检索、经验提炼、压缩和部分 L4 能力依赖模型路由，缺失时自动降级
    enabled: true
    # 存储层（绑定 lifepilot.memory.store）—— 模块拆分后这些键必须置于 store 子节才能生效；
    # 否则回退到代码默认值（vector-db-url 默认 ~/.zhiwei/vectors.db，与主库 db/ 目录分裂导致向量检索失效）
    store:
      embedding-dimensions: 1024
      semantic-match-threshold: 0.92
      vector-db-url: "jdbc:sqlite:${zhiwei.home}/db/vectors.db"
      # L4 程序记忆
      procedural:
        max-templates: 200
        min-reliability: 0.7
        min-use-count: 2
        stale-days: 90
        match-threshold: 0.6
        default-importance: 0.5
    # 消费层（绑定 lifepilot.memory.consumption）
    consumption:
      compression-threshold-tokens: 4000
      # L3.5 热记忆摘要（小预算、带来源，从 L3 可消费实体和 L4 高置信偏好实时派生）
      hot-digest:
        enabled: true
        user-profile-token-budget: 500
        project-memory-token-budget: 400
        experience-token-budget: 500
        facts-token-budget: 400
        user-profile-max-entries: 6
        project-memory-max-entries: 4
        experience-max-entries: 3
        facts-max-entries: 4
      # 对话压缩配置（consumption.compression）
      compression:
        strategy: sliding-window
        window-size: 20
        window-overlap: 2
      # L2 情景记忆自动清理（consumption.episodic-cleanup）
      episodic-cleanup:
        cron: "0 0 5 * * *"
        retention-days: 90
        max-cleanup-per-run: 500
    # 巩固管线 / 遗忘引擎 / 实体提取配置已迁移到 lifepilot.agent.learning.*（consolidation-decoupling）
    # 混合检索相关性过滤
    retrieval:
      min-fused-score: 0.01
      query-max-length: 100
      query-min-length: 10
      min-cross-session-bm25-score: 1.0
      low-quality-score-threshold: 0.3
      low-quality-budget-ratio: 0.5
      time-decay-rate: 0.002
      min-time-decay-factor: 0.5
      min-cross-session-semantic-score: 0.45
      query-rewrite-mode: none
      max-rewrites: 3
      rewrite-timeout-ms: 5000
      min-vector-similarity: 0.15
      topic-switch-threshold: 0.3
      # 记忆精排配置（retrieval.reranker）
      reranker:
        enabled: true
        top-k: 10
      # Agentic Tool 配置（retrieval.agentic-tool）
      agentic-tool:
        default-top-k: 10
        docs-default-top-k: 5
    # 治理层（绑定 lifepilot.memory.governance）
    governance:
      # Memory MCP Server（暴露记忆能力给外部 Agent）
      mcp-server:
        enabled: true
        api-key: ${MEMORY_MCP_API_KEY:}
  skills:
    # ===== Skill 系统配置 =====
    # 支持 Java 原生 Skill、Markdown 声明式 Skill、MCP 外部工具
    # LLM 不可用时 Skill 搜索降级为关键词匹配模式
    # skills 目录由 ZhiweiPaths.home("skills") 提供
    enabled: true
    max-concurrent-activations: 5
    hot-reload-debounce-ms: 500
    skill-filename: SKILL.md
    builtin: {}
    auto-generation:
      enabled: true
      gap-threshold: 0.6
      max-cost-cents: 100
      max-validation-iterations: 2
    shell-action:
      max-timeout-seconds: 30
    chain-action:
      max-steps: 5
    http-action:
      ssrf-protection-enabled: true
      timeout-seconds: 30
    validation:
      max-name-length: 128
      max-instructions-length: 10000
      auto-generated-max-tokens: 10000
      auto-generated-max-steps: 15
      auto-generated-max-timeout: 180
      schema-max-steps: 50
      schema-max-timeout-seconds: 600
    search:
      default-top-k: 10
  knowledge:
    enabled: true
    # data-dir 由 ZhiweiPaths.home("knowledge") 提供
    max-file-size: 104857600
    chunking:
      default-strategy: smart
      fixed-size:
        chunk-size: 1024
        min-chunk-size: 100
        overlap-size: 128
        max-chunk-tokens: 512
        respect-sentences: true
      recursive:
        separators: ["\n\n", "\n", "。", "！", "？", ".", "!", "?", "；", ";", " "]
        max-chunk-size: 1536
        min-chunk-size: 100
        overlap-size: 128
      heading:
        max-heading-level: 3
        max-chunk-size: 2048
      smart-chunker:
        heading-density-threshold: 0.1
        short-document-threshold: 2000
        code-block-density-threshold: 0.3
        semantic-chunking-threshold: 5000
      semantic-chunking:
        enabled: true
        breakpoint-threshold: 0.5
        buffer-size: 1
        min-chunk-size: 100
        max-chunk-size: 1024
      parent-child:
        enabled: true
        parent-max-tokens: 1536
        child-max-tokens: 384
        child-overlap: 64
      structure-analysis:
        max-heading-length: 80
        min-code-indent: 4
        min-table-columns: 2
      region-routing:
        max-intact-code-size: 4096
        max-intact-table-size: 8192
        max-intact-list-size: 4096
        paragraph-min-for-recursive: 200
    vector-indexer:
      batch-size: 32
      max-retries: 2
      embedding-dimension: 1024
    retrieval:
      default-top-k: 10
      vector-weight: 0.6
      fts-weight: 0.4
      rrf-k: 60
      low-confidence-threshold: 0.5
      min-relevance-score: 0.0
      context-window-size: 1
      graph-weight: 0.2
      graph-enabled: true
      deduplication-threshold: 0.85
      correction-enabled: false
      correction-high-threshold: 0.7
      correction-timeout-ms: 3000
    context-enricher:
      enabled: true
      max-prefix-tokens: 100
      batch-enabled: false
      batch-size: 5
      max-prompt-tokens: 4000
    extraction:
      enabled: true
      batch-size: 5
    reranker:
      enabled: false
      type: llm
      model: ""
      top-k: 5
      llm-mode: pointwise
      listwise-max-candidates: 20
      api-provider: jina
      api-key: "${RERANKER_API_KEY:}"
      api-endpoint: ""
      api-timeout-ms: 5000
    query-enhancer:
      mode: rewrite
      timeout-ms: 15000
      max-rewrites: 3
    tokenizer:
      encoding: cl100k_base    # cl100k_base | o200k_base | heuristic
  datasource:
    busy-timeout: 30000
  gateway:
    # ===== Gateway 中间件管道配置 =====
    # 6 层中间件：Auth → RateLimit → Security → Router → Execution → Audit
    # Channel 适配器（企微/钉钉/飞书）需自行申请对应平台开发者凭证
    enabled: true
    middleware:
      auth:
        enabled: true
        order: 100
      rate-limit:
        enabled: true
        order: 200
      security:
        enabled: true
        order: 300
      router:
        enabled: true
        order: 400
      execution:
        enabled: true
        order: 500
      audit:
        enabled: true
        order: 600
    rate-limit:
      max-requests-per-minute: 30
    security:
      prompt-injection:
        enabled: true
      sensitive-data:
        enabled: true
      trust-score:
        enabled: true
        cache-ttl-minutes: 30
    auth:
      web:
        jwt:
          enabled: false
          expiration-hours: 24
        session:
          enabled: true
          timeout-minutes: 30
    router:
      fast-path-commands:
        - llm
        - mcp
        - skill
    execution:
      timeout-seconds: 6000
      streaming-enabled: true
    audit:
      enabled: true

    # ===== 文件产物分发配置 =====
    # 工具产生文件后自动登记 ToolArtifact → session_artifacts → 渠道分发，
    # 支持飞书 / 企微 / 钉钉 / Telegram / Web / Tauri 桌面端文件投递
    delivery:
      # 工具执行器层硬限制
      artifact-max-size-mb: 50
      artifact-max-count-per-tool: 20
      artifact-excluded-dirs:
        - .git
        - node_modules
        - __pycache__
        - .venv
        - target
      artifact-excluded-extensions:
        - tmp
        - log
        - swp
        - swo
      # 各 IM 平台单产物 MB 上限（超过则不投递文件 delivery，主消息追加路径降级提示）
      platform-max-size:
        feishu: 30
        wecom: 20
        dingtalk: 30
        telegram: 50
        web: 200
      request-summary-max-length: 200
      response-summary-max-length: 200
      retention-days: 90
    channels:
      connector-manager:
        enabled: true
        auto-manage-official: true
        host: 127.0.0.1
        port-range-start: 19091
        port-range-end: 19120
        startup-timeout: 45s
        max-attachment-size-bytes: 10485760  # 10MB，单个入站附件最大字节数
      web:
        enabled: true
      wecom:
        enabled: ${WECOM_ENABLED:false}
        corp-id: ${WECOM_CORP_ID:}
        agent-id: ${WECOM_AGENT_ID:}
        secret: ${WECOM_SECRET:}
        token: ${WECOM_TOKEN:}
        encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
      dingtalk:
        enabled: ${DINGTALK_ENABLED:false}
        app-key: ${DINGTALK_APP_KEY:}
        app-secret: ${DINGTALK_APP_SECRET:}
        robot-code: ${DINGTALK_ROBOT_CODE:}
      feishu:
        enabled: ${FEISHU_ENABLED:false}
        app-id: ${FEISHU_APP_ID:}
        app-secret: ${FEISHU_APP_SECRET:}
        verification-token: ${FEISHU_VERIFICATION_TOKEN:}
        encrypt-key: ${FEISHU_ENCRYPT_KEY:}
        event-cache-max-size: 10000
      qq:
        enabled: ${QQ_ENABLED:false}
        app-id: ${QQ_APP_ID:}
        app-secret: ${QQ_APP_SECRET:}
    reconnect:
      max-attempts: 10
      initial-delay-ms: 1000
      max-delay-ms: 60000
      multiplier: 2.0
    session:
      idle-timeout-minutes: 30
      expire-timeout-hours: 24
      cleanup-interval-minutes: 15
    webhook:
      timestamp-tolerance-seconds: 300
      max-retry-count: 3
      retry-interval-seconds: 60
  web:
    sse:
      # SSE 连接绝对超时（创建到当前的总时长），单位 ms。
      # 注意：是绝对时间，不是空闲时间 — 心跳保活无法重置该计时。ReAct 长任务
      # （多轮工具调用 + 推理模型流式响应 + 网页抓取重试）可能跑 10+ 分钟，
      # 5 分钟会强行打断；30 分钟覆盖 95% 真实场景。
      # 若仍不够，治本方案是改 SseSessionManager 为 idle timeout（每次 send 重置 timer），
      # 当前 timeout 字段保持绝对时间语义不变。
      timeout: 1800000
      heartbeat-interval: 30000
      mcp-status-timeout: 1800000
    cors:
      # CORS 跨域配置：开发环境（5173）、Docker 部署（80/同源）和 Tauri 桌面端
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:1420"
        - "http://localhost:80"
        - "http://localhost"
        - "tauri://localhost"
        - "https://tauri.localhost"
        - "http://tauri.localhost"
      allow-credentials: true
  a2ui:
    # A2UI（Agent-to-UI）生成功能配置
    enabled: true
    max-components-per-tree: 50
  media:
    validation:
      parallel-timeout-seconds: 5
    image:
      max-size-bytes: 10485760
      max-dimension: 2048
      jpeg-quality: 0.85
      max-per-request: 5
      process-timeout-seconds: 30
      supported-formats: png,jpeg,gif,webp,bmp
    document:
      max-size-bytes: 52428800
      supported-formats: pdf,docx,doc,md,txt
    audio:
      max-size-bytes: 26214400
      max-duration-seconds: 300
      supported-formats: wav,mp3,ogg,m4a,flac,webm
      whisper-cli-path: auto
      whisper-model: base
      max-recording-seconds: 120
    video:
      max-size-bytes: 524288000
      max-duration-seconds: 1800
      max-key-frames: 120
      supported-formats: mp4,avi,mov,mkv,webm,flv
    tts:
      enabled: true
      voice: alloy
      speed: 1.0
      output-format: mp3
      max-text-length: 4096
    native-audio:
      enabled: true
    native-video:
      enabled: false
      upload-timeout-seconds: 300
      poll-timeout-seconds: 120
      poll-interval-ms: 2000
      max-file-size-bytes: 2147483648
      gemini-api-key: "${GEMINI_API_KEY:}"
      gemini-api-base-url: "https://generativelanguage.googleapis.com"
  marketplace:
    enabled: true
    compatibility-version: "1.0.0"
    index-sources:
      - "https://raw.githubusercontent.com/ntygod/ZhiWei-index/main/index.json"
    cache-ttl-hours: 24
    auto-check-updates: true
    security:
      block-high-risk: false
      injection-patterns:
        - "(?i)ignore\\s+(all\\s+)?previous\\s+instructions?"
        - "(?i)ignore\\s+(all\\s+)?prior"
        - "(?i)disregard\\s+(all\\s+)?(above|previous)"
        - "(?i)forget\\s+(all\\s+)?previous"
    claw-hub:
      enabled: false
      base-url: "https://clawhub.ai/api/v1"
      max-index-size: 50
    # install-dirs 由 ZhiweiPaths 提供（skills/agents/workflows 子目录）
  mcp:
    enabled: true
    server:
      enabled: false
      api-key: ${ZHIWEI_MCP_API_KEY:}
    servers: []
    discovery:
      enabled: true
      paths: []
      seed-builtin-servers: true
  notification:
    # ===== 通知模块配置 =====
    enabled: true
    default-user-id: default
    history-page-size: 20
    max-history-page-size: 100
  workflow:
    # 工作流引擎总开关
    enabled: true
    # 步骤默认超时时间（秒）
    default-step-timeout-seconds: 300
    # 最大并行分支数（ParallelStep）
    max-parallel-branches: 10
    # 最大嵌套深度（SubWorkflowStep）
    max-nesting-depth: 3
    # 最大循环迭代次数（LoopStep）
    max-loop-iterations: 100
    # 工作流 YAML 定义文件目录由 ZhiweiPaths.home("workflows") 提供
    # 崩溃恢复开关
    crash-recovery-enabled: true
    # YAML 文件扫描间隔（秒）
    scan-interval-seconds: 30
    # 是否在启动时释放内置工作流模板到用户目录
    seed-builtin-workflows: true
    # 审批步骤配置
    approval:
      # 默认审批超时时间（秒），24 小时
      default-timeout-seconds: 86400
      # 超时后是否自动批准
      auto-approve-on-timeout: false
    # 事件审计配置
    event-audit:
      # 是否启用事件审计记录
      enabled: true
      # 事件保留天数
      retention-days: 90
    # 步骤重试策略（指数退避）
    retry:
      # 初始延迟（毫秒）
      initial-delay-ms: 500
      # 最大延迟（毫秒）
      max-delay-ms: 5000
      # 最大重试次数
      max-attempts: 3
    # 唤醒调度器配置
    wakeup:
      # 扫描间隔（秒）
      scan-interval-seconds: 10
    # 速率限制配置
    rate-limit:
      # 全局最大并发实例数
      max-concurrent-instances: 20
      # 单个工作流最大并发实例数
      max-instances-per-workflow: 3
  sandbox:
    # 沙箱总开关
    enabled: true
    # 沙箱类型：process / docker
    booter: process
    # 支持的语言列表
    supported-languages:
      - python
      - javascript
      - shell
    # 执行超时（秒）
    execution-timeout-seconds: 30
    # 输出最大字节数
    max-output-bytes: 65536
    # 语言运行时路径
    runtime-paths:
      python: "python"
      javascript: "node"
      shell: "bash"
    # 会话配置
    session:
      # 会话 TTL（秒）— 仅释放进程资源，不删除工作目录
      ttl-seconds: 600
      # 最大活跃会话数
      max-active-sessions: 5
      # 过期清理间隔（秒）
      cleanup-interval-seconds: 60
      # 会话工作目录物理保留天数（超期后由 SessionDirectoryCleanupJob 每天凌晨 4 点清理）
      directory-retention-days: 30
    # 代码预检配置
    validator:
      # 是否启用预检
      enabled: true
      # 是否拒绝 CRITICAL 级别违规
      reject-critical: true
    # Docker 容器配置
    docker:
      # 内存限制（MB）
      memory-limit-mb: 256
      # CPU 限制（核数）
      cpu-limit: 1.0
      # 是否启用网络
      network-enabled: false
      # 镜像前缀
      image-prefix: "zhiwei/sandbox-"
      dida:
        enabled: false
        base-url: "https://api.dida365.com"
    # 运行时配置（捆绑 Python 运行时 + Shell 命令护栏）
    runtime:
      # 捆绑 Python 运行时
      python:
        # 版本号（与离线包文件名 {version} 占位符对齐）
        bundled-version: "3.12.13"
        # 离线包下载地址模板
        download-url-template: "https://github.com/ntygod/ZhiWei/releases/download/runtime-{version}/zhiwei-python-runtime-{version}-{platform}-{arch}.tar.zst"
        # SHA256 校验文件地址模板
        sha256-url-template: "https://github.com/ntygod/ZhiWei/releases/download/runtime-{version}/zhiwei-python-runtime-{version}-{platform}-{arch}.tar.zst.sha256"
        # install-path 由 ZhiweiPaths.home("runtime/python") 提供
        # 是否禁用捆绑运行时（true 时回退到系统 PATH 的 python）
        disabled: false
      # Shell 命令护栏
      command-guard:
        # 是否启用命令护栏
        enabled: true
        # 是否启用 yolo 模式（DANGEROUS 自动放行，HARDLINE 仍拦截，仅本地调试）
        yolo-mode: false
  observability:
    trace:
      enabled: true
      record-prompts: false
      retention-days: 30
      use-scoped-value: false
    guardrail:
      enabled: true
      approval-timeout-seconds: 60
      tool-risk:
        default-risk-level: LOW
        tool-risk-mapping: {}
      content-safety:
        blocked-patterns: []
        sensitive-topics: []
      rate-limit:
        max-calls-per-minute: 60
    redaction:
      enabled: true
      redact-before-llm: true
      redact-in-trace: true
      redact-in-log: true
    evaluation:
      enabled: true
      online-evaluation: true
      tool-selection-weight: 0.30
      parameter-validity-weight: 0.20
      step-efficiency-weight: 0.20
      policy-compliance-weight: 0.20
      token-efficiency-weight: 0.10
      pass-threshold: 0.7
      attention-threshold: 0.5
    metrics:
      enabled: true
      snapshot-interval-seconds: 300
      max-latency-samples: 1000
  # 元能力系统配置
  meta:
    infra:
      max-tool-output-chars: 30000
      web-search:
        provider: tavily
        api-key: ${TAVILY_API_KEY:}
        max-results: 5
        search-depth: basic
        topic: general
        include-answer: true
        connect-timeout-seconds: 10
        read-timeout-seconds: 30
      web-fetch:
        max-content-length: 50000
        timeout-seconds: 10
        min-static-content-length: 100
        render-timeout-seconds: 15
        ssrf:
          enabled: true            # SSRF 防护开关，关闭需谨慎（仅可信环境）
          allowlist: []            # 放行的 host / IP，企业内网可补充如 "internal.corp"
      user-profile:
        timezone: ""
        cache-ttl-seconds: 300
      shell:
        command-blacklist:
          - "rm\\s+-rf\\s+/(?!\\S)"
          - "\\bformat\\s+[a-zA-Z]:"
          - "(?:^|[;&|])\\s*shutdown\\b"
          - "(?:^|[;&|])\\s*reboot\\b"
          - "\\bmkfs\\b"
          - "\\bdd\\s+if="
          - ":\\(\\)\\{\\s*:|:&\\s*\\};:"
          - "\\bchmod\\s+-R\\s+777\\s+/"
        timeout-seconds: 120
        max-output-length: 50000
        yield-ms: 200
        output-read-timeout-seconds: 0  # 0 = 自动计算为 timeout-seconds + 5
        transient-retries: 1
      browser:
        enabled: true
        # 默认 false：本地/桌面可见 Agent 浏览过程；容器部署用 BROWSER_HEADLESS=true 覆写
        headless: ${BROWSER_HEADLESS:false}
        idle-timeout-seconds: 300
        tool-timeout-seconds: 30
        install-timeout-seconds: 600
        text-snapshot-max-length: 10000
        default-scroll-pixels: 500
        wait-timeout-seconds: 10
        accessibility-max-depth: 5
        js-execution-timeout-seconds: 10
        # storage-state-dir 和 user-data-dir 由 ZhiweiPaths.home("cache/browser") 提供
        persist-storage-state: false
        acquisition-mode: LAUNCH        # LAUNCH / CDP / PERSISTENT
        cdp-url: ""                      # CDP 模式的远程调试端口 URL
        # user-data-dir 由 ZhiweiPaths.home("cache/browser") 提供
        snapshot:
          max-elements: 200
          viewport-only: true
          inject-labels: false
        takeover:
          timeout-seconds: 300        # 人工接管挂起等待超时（秒），5 分钟
      git:
        enabled: true
        timeout-seconds: 30
        max-diff-lines: 500
        max-log-entries: 50
        max-blame-lines: 200
        max-output-chars: 50000
      code-execute:
        enabled: true
        default-language: python
      file:
        max-read-size: 1048576
        default-max-chars: 30000
        default-max-entries: 200
        allowed-directories: []
        denied-directories:
          - "/etc"
          - "/var"
          - "C:\\Windows"
      file-edit:
        undo-max-depth: 50
        auto-lint: false
        lint-commands:
          ".py": "python3 -m py_compile {file}"
          ".js": "node --check {file}"
        lint-timeout-seconds: 10
        max-snapshot-size-bytes: 5242880
      interaction:
        response-timeout-seconds: 120
      process:
        max-concurrent: 5
        max-output-buffer-size: 100000
        idle-timeout-minutes: 30
      shell-session:
        enabled: true
        max-concurrent-sessions: 5
        ttl-minutes: 30
        default-cols: 120
        default-rows: 40
        history-lines: 2000
        exec-timeout-seconds: 120
        output-max-chars: 50000
        cleanup-interval-seconds: 60
      kernel:
        enabled: true
        max-concurrent-kernels: 3
        ttl-minutes: 30
        cleanup-interval-seconds: 60
        execution-timeout-seconds: 60
        node-runtime: "node"
        max-output-chars: 50000
    introspection:
      cache-ttl-seconds: 60
      debounce-millis: 500
    skill-discovery:
      # 种子 Skill 扫描基于 classpath:skills/*/SKILL.md 通配符自动发现，无需列出路径
      enabled: true
    onboarding:
      auto-trigger: true
      agent-definition: preset-agents/onboarding-guide.md

# 日志配置见 logback-spring.xml
