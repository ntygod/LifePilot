id: scheduled-inspection
name: 定时巡检与告警
description: 定时执行系统健康检查，根据检查结果判断是否需要告警，异常时等待冷却后触发自动修复子工作流
version: "1.0"
triggers:
  - type: cron
    cron: "0 */30 * * * *"
inputs:
  checkScope:
    type: string
    required: false
    defaultValue: all
    description: 巡检范围（all / core / external）
  alertThreshold:
    type: string
    required: false
    defaultValue: "80"
    description: 告警阈值（百分比）
metadata:
  category: 系统运维
  complexity: advanced
steps:
  - id: run-health-check
    name: 执行健康检查（待实现）
    type: tool
    toolId: system.health-check
    params:
      scope: "${inputs.checkScope}"
      includeMetrics: "true"
    errorStrategy:
      type: skip
      reason: 系统健康检查工具尚未实现，跳过

  - id: check-llm-status
    name: 检查 LLM 服务状态（待实现）
    type: tool
    toolId: llm.ping
    params:
      timeout: "5000"
    errorStrategy:
      type: skip
      reason: LLM 健康检查工具尚未实现，跳过

  - id: check-db-status
    name: 检查数据库状态（待实现）
    type: tool
    toolId: db.health-check
    params:
      checkIntegrity: "true"
      checkWalSize: "true"
    errorStrategy:
      type: skip
      reason: 数据库健康检查工具尚未实现，跳过

  - id: analyze-results
    name: 分析巡检结果
    type: llm
    scene: workflow
    prompt: |
      请分析以下系统巡检结果，判断系统健康状态：

      ## 系统健康检查
      ${steps.run-health-check.output.result}

      ## LLM 服务状态
      ${steps.check-llm-status.output.result}

      ## 数据库状态
      ${steps.check-db-status.output.result}

      ## 告警阈值
      ${inputs.alertThreshold}%

      请输出 JSON 格式：
      {
        "overallStatus": "healthy|degraded|critical",
        "score": 0-100,
        "issues": [{"component": "组件名", "severity": "low|medium|high|critical", "description": "问题描述"}],
        "recommendation": "处理建议"
      }
    dependsOn:
      - run-health-check
      - check-llm-status
      - check-db-status

  - id: health-decision
    name: 健康状态判定
    type: condition
    condition: "${steps.analyze-results.output.result.overallStatus} != 'healthy'"
    dependsOn:
      - analyze-results
    then:
      - id: severity-check
        name: 严重程度判定
        type: condition
        condition: "${steps.analyze-results.output.result.overallStatus} == 'critical'"
        then:
          - id: send-critical-alert
            name: 发送紧急告警
            type: tool
            toolId: builtin.interact.notify
            params:
              channel: urgent
              title: "系统紧急告警"
              body: "${steps.analyze-results.output.result.recommendation}"
              recipient: ops-team
            errorStrategy:
              type: retry
              maxAttempts: 3
              initialDelayMs: 500
              maxDelayMs: 3000
          - id: cooldown-wait
            name: 冷却等待
            type: wait
            durationSeconds: 60
          - id: auto-remediation
            name: 自动修复
            type: sub-workflow
            workflowId: system-remediation
            params:
              issues: "${steps.analyze-results.output.result.issues}"
              scope: "${inputs.checkScope}"
          - id: verify-fix
            name: 修复后验证（待实现）
            type: tool
            toolId: system.health-check
            params:
              scope: "${inputs.checkScope}"
              includeMetrics: "true"
            errorStrategy:
              type: skip
              reason: 系统健康检查工具尚未实现，跳过
        else:
          - id: send-warning-alert
            name: 发送降级告警
            type: tool
            toolId: builtin.interact.notify
            params:
              channel: webhook
              title: "系统降级告警"
              body: "${steps.analyze-results.output.result.recommendation}"
              recipient: ops-team
    else:
      - id: log-healthy
        name: 记录健康状态
        type: noop

  - id: save-inspection-record
    name: 保存巡检记录（待实现）
    type: tool
    toolId: inspection.save-record
    params:
      scope: "${inputs.checkScope}"
      result: "${steps.analyze-results.output.result}"
      timestamp: "${now}"
    dependsOn:
      - health-decision
    errorStrategy:
      type: skip
      reason: 巡检记录保存工具尚未实现，跳过
