id: scheduled-inspection
name: 定时巡检与告警
description: 定时执行系统健康检查，根据检查结果判断是否需要告警，异常时等待冷却后触发自动修复子工作流
version: "1.0"
triggers:
  - type: cron
    cron: "0 */30 * * * *"
inputs:
  checkScope:
    type: string
    required: false
    defaultValue: all
    description: 巡检范围（all / core / external）
  alertThreshold:
    type: string
    required: false
    defaultValue: "80"
    description: 告警阈值（百分比）
metadata:
  category: 系统运维
  complexity: advanced
steps:
  - id: run-health-check
    name: 执行健康检查
    type: tool
    toolId: system.status
    params: {}
    errorStrategy:
      type: skip
      reason: 健康检查失败时仍可继续其他检查

  - id: check-llm-status
    name: 检查 LLM 服务状态
    type: tool
    toolId: system.status
    params: {}
    errorStrategy:
      type: skip
      reason: LLM 状态检查失败时仍可继续其他检查

  - id: check-db-status
    name: 检查数据库状态
    type: tool
    toolId: builtin.shell.exec
    params:
      command: "echo 'SELECT 1;' | sqlite3 :memory:"
      timeout: "5000"
    errorStrategy:
      type: skip
      reason: 数据库检查失败时仍可继续其他检查

  - id: analyze-results
    name: 分析巡检结果
    type: llm
    scene: agent_reasoning
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "overallStatus": { "type": "string" },
          "score": { "type": "number" },
          "issues": { "type": "array" },
          "recommendation": { "type": "string" }
        },
        "required": ["overallStatus", "score", "issues", "recommendation"]
      }
    prompt: |
      请分析以下系统巡检结果，判断系统健康状态，并严格输出 JSON 结果：

      ## 系统健康检查
      ${steps.run-health-check.output.result}

      ## LLM 服务状态
      ${steps.check-llm-status.output.result}

      ## 数据库状态
      ${steps.check-db-status.output.result}

      ## 告警阈值
      ${inputs.alertThreshold}%
    dependsOn:
      - run-health-check
      - check-llm-status
      - check-db-status

  - id: health-decision
    name: 健康状态判定
    type: condition
    condition: "${steps.analyze-results.output.result.overallStatus} != 'healthy'"
    dependsOn:
      - analyze-results
    then:
      - id: severity-check
        name: 严重程度判定
        type: condition
        condition: "${steps.analyze-results.output.result.overallStatus} == 'critical'"
        then:
          - id: send-critical-alert
            name: 发送紧急告警
            type: tool
            toolId: builtin.interact.notify
            params:
              channel: urgent
              title: 系统紧急告警
              body: "${steps.analyze-results.output.result.recommendation}"
              recipient: ops-team
            errorStrategy:
              type: retry
              maxAttempts: 3
              initialDelayMs: 500
              maxDelayMs: 3000
          - id: cooldown-wait
            name: 冷却等待
            type: wait
            durationSeconds: 60
          - id: auto-remediation
            name: 自动修复
            type: sub-workflow
            workflowId: system-remediation
            params:
              issues: "${steps.analyze-results.output.result.issues}"
              scope: "${inputs.checkScope}"
          - id: verify-fix
            name: 修复后验证
            type: tool
            toolId: system.status
            params: {}
            errorStrategy:
              type: skip
              reason: 验证失败不影响已执行的修复
        else:
          - id: send-warning-alert
            name: 发送降级告警
            type: tool
            toolId: builtin.interact.notify
            params:
              channel: webhook
              title: 系统降级告警
              body: "${steps.analyze-results.output.result.recommendation}"
              recipient: ops-team
    else:
      - id: log-healthy
        name: 记录健康状态
        type: noop

  - id: save-inspection-record
    name: 保存巡检记录
    type: tool
    toolId: builtin.datastore.add_document
    params:
      collection: inspection-records
      data: '{"scope": "${inputs.checkScope}", "result": "${steps.analyze-results.output.result}", "timestamp": "${now}"}'
    dependsOn:
      - health-decision
    errorStrategy:
      type: skip
      reason: 巡检记录保存失败不影响告警流程
