id: daily-reminder
name: 每日待办提醒
description: 每天早上自动检查待办事项，对即将到期的任务发送提醒通知，帮助用户管理日常任务
version: "1.0"
triggers:
  - type: cron
    cron: "0 0 8 * * *"
inputs:
  hoursAhead:
    type: string
    required: false
    defaultValue: "24"
    description: 提前提醒小时数
metadata:
  category: 任务管理
  complexity: beginner
steps:
  - id: fetch-todos
    name: 获取今日待办
    type: skill
    skillId: todo
    params:
      operation: list
      filter: pending
    errorStrategy:
      type: skip
      reason: 无待办时跳过后续步骤

  - id: filter-urgent
    name: 筛选紧急待办
    type: llm
    scene: agent_reasoning
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "urgentItems": { "type": "array" },
          "normalItems": { "type": "array" },
          "urgentCount": { "type": "number" }
        },
        "required": ["urgentItems", "normalItems", "urgentCount"]
      }
    prompt: |
      请分析以下待办事项，筛选出需要紧急处理的项（${inputs.hoursAhead}小时内到期或标记为重要）：

      ${steps.fetch-todos.output.result}

      输出 JSON：
      {
        "urgentItems": ["紧急待办列表"],
        "normalItems": ["普通待办列表"],
        "urgentCount": 数量
      }
    dependsOn:
      - fetch-todos
    errorStrategy:
      type: skip
      reason: LLM分析失败不影响提醒发送

  - id: check-urgent
    name: 检查是否有紧急待办
    type: condition
    condition: "${steps.filter-urgent.output.result.urgentCount} > 0"
    dependsOn:
      - filter-urgent
    then:
      - id: send-reminder
        name: 发送待办提醒
        type: notify
        targetUserId: owner
        content: |
          您有 ${steps.filter-urgent.output.result.urgentCount} 项待办需要关注：

          紧急待办：
          ${steps.filter-urgent.output.result.urgentItems}

          普通待办：
          ${steps.filter-urgent.output.result.normalItems}

          美好的一天，从管理待办开始！
        contentType: MARKDOWN
        urgency: MEDIUM
        errorStrategy:
          type: skip
          reason: 通知发送失败不影响工作流完成
    else:
      - id: no-urgent-log
        name: 记录无紧急待办
        type: noop
