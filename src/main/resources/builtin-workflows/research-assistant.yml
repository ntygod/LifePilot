id: research-assistant
name: 调研助手
description: 多源并行搜索与深度分析，经质量检查和人工审批后发布调研成果
version: "1.0"
triggers:
  - type: manual
inputs:
  topic:
    type: string
    required: true
    description: 调研主题
  depth:
    type: string
    required: false
    defaultValue: standard
    description: 调研深度（brief/standard/deep）
metadata:
  category: 知识管理
  complexity: intermediate
steps:
  - id: search-web
    name: 网络搜索
    type: tool
    toolId: web.search
    params:
      query: "${inputs.topic}"
      maxResults: "10"
    errorStrategy:
      type: retry
      maxAttempts: 2

  - id: search-memory
    name: 记忆搜索
    type: skill
    skillId: memory
    params:
      operation: search
      query: "${inputs.topic}"
      limit: "10"
    errorStrategy:
      type: skip
      reason: 记忆中无相关内容时跳过

  - id: deep-analysis
    name: 深度分析
    type: llm
    scene: agent_reasoning
    capability: CHAT
    prompt: |
      针对主题"${inputs.topic}"进行${inputs.depth}级别的调研分析。

      ## 网络搜索结果
      ${steps.search-web.output.result}

      ## 历史记忆
      ${steps.search-memory.output.result}

      请按以下结构输出调研报告：
      1. 主题概述
      2. 核心发现（按重要性排序）
      3. 不同观点与争议
      4. 数据与证据
      5. 结论与建议
      6. 信息来源列表
    dependsOn:
      - search-web
      - search-memory

  - id: quality-check
    name: 质量检查
    type: llm
    scene: agent_reasoning
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "score": { "type": "number" },
          "passCheck": { "type": "boolean" },
          "issues": { "type": "array", "items": { "type": "string" } }
        },
        "required": ["score", "passCheck", "issues"]
      }
    prompt: |
      评估以下调研报告的质量（满分100）：

      ${steps.deep-analysis.output.result}

      评估维度：信息准确性、逻辑完整性、来源可靠性、结论合理性。
      60分以上为通过。

      输出 JSON：{"score": 分数, "passCheck": true/false, "issues": ["问题列表"]}
    dependsOn:
      - deep-analysis

  - id: approval-gate
    name: 审批发布
    type: approval
    message: |
      调研报告审批：
      - 主题：${inputs.topic}
      - 质量评分：${steps.quality-check.output.result.score}/100
      - 问题：${steps.quality-check.output.result.issues}
    approvers:
      - owner
    timeoutSeconds: 86400
    autoApproveOnTimeout: false
    dependsOn:
      - quality-check

  - id: save-result
    name: 保存调研成果
    type: skill
    skillId: memory
    params:
      operation: save
      content: "${steps.deep-analysis.output.result}"
      tags: "research,${inputs.topic}"
      importance: high
    dependsOn:
      - approval-gate
    errorStrategy:
      type: skip
      reason: 保存失败不影响通知

  - id: notify-complete
    name: 通知完成
    type: notify
    targetUserId: owner
    content: |
      🔍 调研报告已完成：${inputs.topic}

      质量评分：${steps.quality-check.output.result.score}/100

      ${steps.deep-analysis.output.result}
    contentType: MARKDOWN
    dependsOn:
      - save-result
    errorStrategy:
      type: skip
