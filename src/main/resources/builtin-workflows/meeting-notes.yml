id: meeting-notes
name: 会议纪要
description: 手动触发，输入会议文字记录，自动生成结构化会议纪要并提取待办事项
version: "1.0"
triggers:
  - type: manual
inputs:
  transcript:
    type: string
    required: true
    description: 会议文字记录或语音转文字内容
  meetingTitle:
    type: string
    required: false
    defaultValue: "未命名会议"
    description: 会议标题
steps:
  - id: generate-notes
    name: 生成结构化纪要
    type: llm
    scene: workflow
    prompt: |
      请根据以下会议记录生成结构化会议纪要：

      ## 会议标题
      ${inputs.meetingTitle}

      ## 会议记录
      ${inputs.transcript}

      请按以下格式输出：
      1. **会议摘要**：一段话概括会议核心内容
      2. **讨论要点**：按主题分类列出讨论内容
      3. **决议事项**：明确列出达成的决定
      4. **待办事项**：提取所有 action item，标注负责人（如有提及）
      5. **遗留问题**：列出未解决的问题
  - id: extract-todos
    name: 提取待办事项
    type: llm
    scene: workflow
    prompt: |
      从以下会议纪要中提取所有待办事项，每条待办用一行表示：

      ${steps.generate-notes.output.result}

      格式：- [负责人] 待办内容
      如果没有明确负责人，标注为 [待分配]
    errorStrategy:
      type: skip
