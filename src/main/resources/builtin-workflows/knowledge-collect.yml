id: knowledge-collect
name: 定时知识采集
description: 每天定时搜索感兴趣的主题，去重摘要后保存到知识库，持续追踪行业动态
version: "1.0"
triggers:
  - type: cron
    cron: "0 0 7 * * *"
  - type: manual
inputs:
  topics:
    type: string
    required: true
    description: 要采集的主题列表（逗号分隔，如"AI最新进展,Spring Boot"）
  maxResultsPerTopic:
    type: string
    required: false
    defaultValue: "5"
    description: 每个主题最多采集的结果数
metadata:
  category: 知识管理
  complexity: intermediate
steps:
  - id: parse-topics
    name: 解析主题列表
    type: llm
    scene: knowledge_extraction
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "topics": { "type": "array", "items": { "type": "string" } }
        },
        "required": ["topics"]
      }
    prompt: |
      将以下主题字符串解析为数组，每个主题保持原文：

      ${inputs.topics}

      输出 JSON：{"topics": ["主题1", "主题2"]}

  - id: collect-each-topic
    name: 逐主题采集
    type: loop
    items: "${steps.parse-topics.output.result.topics}"
    loopVar: currentTopic
    dependsOn:
      - parse-topics
    body:
      - id: search-topic
        name: 搜索主题
        type: tool
        toolId: builtin.web.search
        params:
          query: "${currentTopic} 最新"
          maxResults: "${inputs.maxResultsPerTopic}"
        errorStrategy:
          type: retry
          maxAttempts: 2

      - id: deduplicate-and-summarize
        name: 去重并生成摘要
        type: llm
        scene: knowledge_extraction
        capability: CHAT
        prompt: |
          对以下关于"${currentTopic}"的搜索结果进行处理：

          ${steps.search-topic.output.result}

          请：
          1. 去除重复或高度相似的内容
          2. 为每条有价值的信息生成一句话摘要
          3. 标注信息来源
          4. 按重要性排序
        dependsOn:
          - search-topic

      - id: save-to-knowledge
        name: 保存到知识库
        type: skill
        skillId: memory
        params:
          operation: save
          content: "${steps.deduplicate-and-summarize.output.result}"
          tags: "knowledge-collect,${currentTopic}"
          importance: medium
        dependsOn:
          - deduplicate-and-summarize
        errorStrategy:
          type: skip
          reason: 单个主题保存失败不影响其他主题

  - id: notify-completion
    name: 通知采集完成
    type: notify
    targetUserId: owner
    content: |
      📚 知识采集完成

      已采集主题：${inputs.topics}
    contentType: TEXT
    dependsOn:
      - collect-each-topic
    errorStrategy:
      type: skip
      reason: 通知失败不影响采集结果
