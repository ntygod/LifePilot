id: morning-briefing
name: 晨间简报
description: 每天早上自动获取今日待办和日程，生成简洁的晨间简报摘要
version: "1.0"
triggers:
  - type: cron
    cron: "0 0 8 * * *"
steps:
  - id: fetch-todos
    name: 获取今日待办
    type: skill
    skillId: todo.list
    params:
      filter: "today"
  - id: fetch-schedule
    name: 获取今日日程
    type: skill
    skillId: schedule.today
    params: {}
  - id: generate-briefing
    name: 生成晨间简报
    type: llm
    scene: workflow
    prompt: |
      请根据以下信息生成一份简洁的晨间简报：

      ## 今日待办
      ${steps.fetch-todos.output.result}

      ## 今日日程
      ${steps.fetch-schedule.output.result}

      要求：
      1. 按优先级排列待办事项
      2. 标注日程时间冲突（如有）
      3. 给出今日重点建议
      4. 语气简洁友好
