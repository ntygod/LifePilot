id: batch-processing
name: 批量任务处理
description: 获取待处理任务列表，循环逐条处理每个任务项，支持错误重试策略，最终生成处理汇总报告
version: "1.0"
triggers:
  - type: cron
    cron: "0 0 2 * * *"
  - type: manual
inputs:
  taskSource:
    type: string
    required: false
    defaultValue: pending-queue
    description: 任务来源队列名称
  maxItems:
    type: string
    required: false
    defaultValue: "100"
    description: 单次最大处理数量
  dryRun:
    type: string
    required: false
    defaultValue: "false"
    description: 是否为试运行模式（不实际执行变更）
metadata:
  category: 自动化运维
  complexity: advanced
steps:
  - id: fetch-task-list
    name: 获取待处理任务列表
    type: tool
    toolId: builtin.datastore.query_documents
    params:
      collection: "${inputs.taskSource}"
      filter: '{"status": "pending"}'
      limit: "${inputs.maxItems}"
      sort: '{"created_at": "asc"}'
    errorStrategy:
      type: skip
      reason: 任务集合可能尚未创建，跳过

  - id: validate-tasks
    name: 校验任务数据
    type: llm
    scene: knowledge_extraction
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "validTasks": { "type": "array" },
          "invalidTasks": { "type": "array" },
          "totalValid": { "type": "number" },
          "totalInvalid": { "type": "number" }
        },
        "required": ["validTasks", "invalidTasks", "totalValid", "totalInvalid"]
      }
    prompt: |
      请校验以下待处理任务列表的数据完整性，并严格输出 JSON 结果：

      ${steps.fetch-task-list.output.result}

      校验规则：
      1. 每条任务必须包含 id、type、payload 字段
      2. payload 不能为空
      3. type 必须是已知类型（data-sync / notification / cleanup / transform）
    dependsOn:
      - fetch-task-list

  - id: process-each-task
    name: 逐条处理任务
    type: loop
    items: "${steps.validate-tasks.output.result.validTasks}"
    loopVar: currentTask
    dependsOn:
      - validate-tasks
    body:
      - id: classify-task
        name: 任务分类路由
        type: condition
        condition: "${currentTask.type} == 'data-sync'"
        then:
          - id: execute-data-sync
            name: 执行数据同步
            type: tool
            toolId: builtin.sync.trigger
            params:
              taskId: "${currentTask.id}"
              payload: "${currentTask.payload}"
              dryRun: "${inputs.dryRun}"
            errorStrategy:
              type: retry
              maxAttempts: 2
              initialDelayMs: 500
              maxDelayMs: 3000
        else:
          - id: execute-general-task
            name: 执行通用任务
            type: llm
            scene: task_planning
            capability: STRUCTURED_OUTPUT
            outputSchema: |
              {
                "type": "object",
                "properties": {
                  "taskId": { "type": "string" },
                  "action": { "type": "string" },
                  "success": { "type": "boolean" },
                  "message": { "type": "string" }
                },
                "required": ["taskId", "action", "success", "message"]
              }
            prompt: |
              请根据以下任务信息决定执行策略并输出结果：
              - 任务 ID：${currentTask.id}
              - 任务类型：${currentTask.type}
              - 任务载荷：${currentTask.payload}
              - 试运行模式：${inputs.dryRun}

              支持的任务类型：
              - notification：发送通知
              - cleanup：清理过期数据
              - transform：数据转换
      - id: update-task-status
        name: 更新任务状态
        type: tool
        toolId: builtin.datastore.update_document
        params:
          collection: "${inputs.taskSource}"
          documentId: "${currentTask.id}"
          data: '{"status": "completed"}'
        errorStrategy:
          type: skip
          reason: 状态更新失败不阻塞后续任务处理

  - id: collect-results
    name: 汇总处理结果
    type: tool
    toolId: builtin.datastore.query_documents
    params:
      collection: "${inputs.taskSource}"
      filter: '{"status": {"$ne": "pending"}}'
      limit: "${inputs.maxItems}"
    dependsOn:
      - process-each-task
    errorStrategy:
      type: skip
      reason: 结果汇总失败不影响已完成的处理

  - id: generate-summary
    name: 生成处理汇总报告
    type: llm
    scene: document_summary
    capability: CHAT
    prompt: |
      请根据以下批量处理结果生成汇总报告：

      ## 任务来源
      ${inputs.taskSource}

      ## 数据校验结果
      - 有效任务数：${steps.validate-tasks.output.result.totalValid}
      - 无效任务数：${steps.validate-tasks.output.result.totalInvalid}

      ## 处理结果
      ${steps.collect-results.output.result}

      ## 运行模式
      试运行：${inputs.dryRun}

      请输出：
      1. 处理概览
      2. 失败任务明细
      3. 性能统计
      4. 建议
    dependsOn:
      - collect-results

  - id: send-summary
    name: 发送汇总通知
    type: tool
    toolId: builtin.interact.notify
    params:
      channel: webhook
      title: 批量任务处理完成
      body: "${steps.generate-summary.output.result}"
      recipient: ops-team
    dependsOn:
      - generate-summary
    errorStrategy:
      type: skip
      reason: 通知发送失败不影响整体流程
