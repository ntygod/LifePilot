id: batch-processing
name: 批量任务处理
description: 获取待处理任务列表，循环逐条处理每个任务项，支持错误重试策略，最终生成处理汇总报告
version: "1.0"
triggers:
  - type: cron
    cron: "0 0 2 * * *"
  - type: manual
inputs:
  taskSource:
    type: string
    required: false
    defaultValue: pending-queue
    description: 任务来源队列名称
  maxItems:
    type: string
    required: false
    defaultValue: "100"
    description: 单次最大处理数量
  dryRun:
    type: string
    required: false
    defaultValue: "false"
    description: 是否为试运行模式（不实际执行变更）
metadata:
  category: 自动化运维
  complexity: advanced
steps:
  - id: fetch-task-list
    name: 获取待处理任务列表
    type: tool
    toolId: queue.fetch-pending
    params:
      source: "${inputs.taskSource}"
      limit: "${inputs.maxItems}"
      status: pending
    errorStrategy:
      type: retry
      maxAttempts: 3
      initialDelayMs: 1000
      maxDelayMs: 5000

  - id: validate-tasks
    name: 校验任务数据
    type: llm
    scene: workflow
    prompt: |
      请校验以下待处理任务列表的数据完整性：

      ${steps.fetch-task-list.output.result}

      校验规则：
      1. 每条任务必须包含 id、type、payload 字段
      2. payload 不能为空
      3. type 必须是已知类型（data-sync / notification / cleanup / transform）

      输出 JSON 格式：
      {
        "validTasks": [有效任务列表],
        "invalidTasks": [无效任务及原因],
        "totalValid": 数量,
        "totalInvalid": 数量
      }
    dependsOn:
      - fetch-task-list

  - id: process-each-task
    name: 逐条处理任务
    type: loop
    items: "${steps.validate-tasks.output.result.validTasks}"
    loopVar: currentTask
    dependsOn:
      - validate-tasks
    body:
      - id: classify-task
        name: 任务分类路由
        type: condition
        condition: "${currentTask.type} == 'data-sync'"
        then:
          - id: execute-data-sync
            name: 执行数据同步
            type: tool
            toolId: sync.execute
            params:
              taskId: "${currentTask.id}"
              payload: "${currentTask.payload}"
              dryRun: "${inputs.dryRun}"
            errorStrategy:
              type: retry
              maxAttempts: 2
              initialDelayMs: 500
              maxDelayMs: 3000
        else:
          - id: execute-general-task
            name: 执行通用任务
            type: tool
            toolId: task.execute
            params:
              taskId: "${currentTask.id}"
              type: "${currentTask.type}"
              payload: "${currentTask.payload}"
              dryRun: "${inputs.dryRun}"
            errorStrategy:
              type: retry
              maxAttempts: 2
              initialDelayMs: 500
              maxDelayMs: 3000
      - id: update-task-status
        name: 更新任务状态
        type: tool
        toolId: queue.update-status
        params:
          taskId: "${currentTask.id}"
          status: completed
        errorStrategy:
          type: skip
          reason: 状态更新失败不阻塞后续任务处理

  - id: collect-results
    name: 汇总处理结果
    type: tool
    toolId: queue.collect-results
    params:
      source: "${inputs.taskSource}"
      batchId: "${steps.fetch-task-list.output.result.batchId}"
    dependsOn:
      - process-each-task

  - id: generate-summary
    name: 生成处理汇总报告
    type: llm
    scene: workflow
    prompt: |
      请根据以下批量处理结果生成汇总报告：

      ## 任务来源
      ${inputs.taskSource}

      ## 数据校验结果
      - 有效任务数：${steps.validate-tasks.output.result.totalValid}
      - 无效任务数：${steps.validate-tasks.output.result.totalInvalid}

      ## 处理结果
      ${steps.collect-results.output.result}

      ## 运行模式
      试运行：${inputs.dryRun}

      请输出：
      1. **处理概览**：总数、成功数、失败数、跳过数
      2. **失败任务明细**：列出失败任务 ID 和失败原因
      3. **性能统计**：平均处理时长、最慢任务
      4. **建议**：基于结果的优化建议
    dependsOn:
      - collect-results

  - id: send-summary
    name: 发送汇总通知
    type: tool
    toolId: notification.send
    params:
      channel: webhook
      title: "批量任务处理完成"
      body: "${steps.generate-summary.output.result}"
      recipient: ops-team
    dependsOn:
      - generate-summary
    errorStrategy:
      type: skip
      reason: 通知发送失败不影响整体流程
