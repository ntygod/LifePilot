id: weekly-summary
name: 周报生成
description: 每周五自动汇总待办、日程、习惯数据，生成周报并保存到记忆
version: "1.0"
triggers:
  - type: cron
    cron: "0 0 18 * * 5"
  - type: manual
metadata:
  category: 效率提升
  complexity: beginner
steps:
  - id: fetch-todo-stats
    name: 获取待办统计
    type: skill
    skillId: todo
    params:
      operation: stats
      period: last-7-days
    errorStrategy:
      type: skip
      reason: 待办数据缺失不影响周报生成

  - id: fetch-schedule-stats
    name: 获取日程统计
    type: skill
    skillId: schedule
    params:
      period: last-7-days
    errorStrategy:
      type: skip
      reason: 日程数据缺失不影响周报生成

  - id: fetch-habit-stats
    name: 获取习惯统计
    type: skill
    skillId: habit
    params:
      operation: report
      period: last-7-days
    errorStrategy:
      type: skip
      reason: 习惯数据缺失不影响周报生成

  - id: generate-report
    name: 生成周报
    type: llm
    scene: document_summary
    capability: CHAT
    prompt: |
      请根据以下数据生成一份简洁的周报：

      ## 待办完成情况
      ${steps.fetch-todo-stats.output.result}

      ## 日程执行情况
      ${steps.fetch-schedule-stats.output.result}

      ## 习惯坚持情况
      ${steps.fetch-habit-stats.output.result}

      请按以下结构输出：
      1. 本周概览（一句话总结 + 关键数据）
      2. 亮点与成就
      3. 需要改进的地方
      4. 下周建议（具体可执行的 2-3 条建议）
    dependsOn:
      - fetch-todo-stats
      - fetch-schedule-stats
      - fetch-habit-stats

  - id: save-to-memory
    name: 保存周报到记忆
    type: skill
    skillId: memory
    params:
      operation: save
      content: "${steps.generate-report.output.result}"
      tags: "weekly-summary,周报"
      importance: medium
    dependsOn:
      - generate-report
    errorStrategy:
      type: skip
      reason: 保存失败不影响通知发送

  - id: send-report
    name: 发送周报
    type: notify
    targetUserId: owner
    content: |
      📊 本周周报已生成

      ${steps.generate-report.output.result}
    contentType: MARKDOWN
    dependsOn:
      - save-to-memory
    errorStrategy:
      type: skip
      reason: 通知失败不影响周报保存
