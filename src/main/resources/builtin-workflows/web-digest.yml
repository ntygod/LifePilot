id: web-digest
name: 网页摘要
description: 手动触发，输入 URL 列表，自动抓取网页内容并生成摘要
version: "1.0"
triggers:
  - type: manual
inputs:
  urls:
    type: list
    required: true
    description: 需要摘要的网页 URL 列表
steps:
  - id: crawl-pages
    name: 遍历抓取网页
    type: loop
    items: "${inputs.urls}"
    loopVar: url
    body:
      - id: fetch-page
        name: 抓取网页内容
        type: tool
        toolId: web.fetch
        params:
          url: "${url}"
        errorStrategy:
          type: skip
  - id: generate-digest
    name: 生成综合摘要
    type: llm
    scene: workflow
    prompt: |
      请对以下网页内容生成综合摘要：

      ${steps.crawl-pages.output.result}

      要求：
      1. 每个网页提取核心观点（3-5 条）
      2. 识别跨网页的共同主题
      3. 生成一段综合摘要（200 字以内）
      4. 列出关键信息和数据
