id: content-review
name: 智能内容审核流程
description: 使用 LLM 分析内容风险等级，高风险内容进入人工审批，低风险自动通过，最终发送通知
version: "1.0"
triggers:
  - type: event
    eventType: content.submitted
  - type: manual
inputs:
  content:
    type: string
    required: true
    description: 待审核的内容文本
  contentType:
    type: string
    required: false
    defaultValue: article
    description: 内容类型（article / comment / post）
  author:
    type: string
    required: false
    defaultValue: unknown
    description: 内容作者标识
metadata:
  category: 内容安全
  complexity: advanced
steps:
  - id: preprocess
    name: 内容预处理
    type: llm
    scene: workflow
    prompt: |
      请对以下内容进行预处理和规范化：

      ${inputs.content}

      处理规则：
      1. 去除 HTML 标签，保留纯文本
      2. 去除多余空白和换行
      3. 统一标点符号为中文标点
      4. 保留原始语义不变

      直接输出处理后的纯文本内容，不要添加额外说明。

  - id: llm-risk-analysis
    name: LLM 风险分析
    type: llm
    scene: content-review
    prompt: |
      请对以下内容进行风险分析，输出 JSON 格式结果：

      ## 内容类型
      ${inputs.contentType}

      ## 待审核内容
      ${steps.preprocess.output.result}

      请从以下维度评估：
      1. 违规风险（涉政 / 涉黄 / 暴力 / 欺诈）
      2. 质量评分（1-10）
      3. 敏感词检测

      输出格式：
      {
        "riskLevel": "high|medium|low",
        "riskScore": 0-100,
        "categories": ["违规类别"],
        "qualityScore": 1-10,
        "sensitiveWords": ["敏感词列表"],
        "summary": "风险摘要"
      }
    dependsOn:
      - preprocess

  - id: keyword-scan
    name: 关键词扫描
    type: llm
    scene: workflow
    prompt: |
      请对以下文本进行关键词扫描，检测敏感词和违规关键词：

      ${steps.preprocess.output.result}

      扫描维度：
      1. 政治敏感词
      2. 色情低俗词
      3. 暴力恐怖词
      4. 欺诈诱导词
      5. 广告营销词

      输出 JSON 格式：
      {
        "hitCount": 命中关键词总数,
        "keywords": ["命中的关键词列表"],
        "categories": {"类别": ["该类别命中的词"]},
        "riskSummary": "扫描结果摘要"
      }
    dependsOn:
      - preprocess

  - id: risk-decision
    name: 风险等级判定
    type: condition
    condition: "${steps.llm-risk-analysis.output.result.riskLevel} == 'high' || ${steps.keyword-scan.output.result.hitCount} > 5"
    dependsOn:
      - llm-risk-analysis
      - keyword-scan
    then:
      - id: human-approval
        name: 人工审批
        type: approval
        message: |
          内容审核需要人工确认：
          - 作者：${inputs.author}
          - 类型：${inputs.contentType}
          - 风险等级：${steps.llm-risk-analysis.output.result.riskLevel}
          - 风险摘要：${steps.llm-risk-analysis.output.result.summary}
          - 命中关键词数：${steps.keyword-scan.output.result.hitCount}
        approvers:
          - content-reviewer
          - admin
        timeoutSeconds: 7200
        autoApproveOnTimeout: false
      - id: approval-result-check
        name: 审批结果判定
        type: condition
        condition: "${steps.human-approval.output.approved} == true"
        then:
          - id: mark-approved-manual
            name: 标记人工通过
            type: tool
            toolId: builtin.datastore.update_document
            params:
              collection: content-review
              documentId: "${inputs.content}"
              data: '{"status": "approved", "reviewer": "manual"}'
            errorStrategy:
              type: skip
              reason: 状态更新失败不影响审核流程
        else:
          - id: mark-rejected
            name: 标记拒绝
            type: tool
            toolId: builtin.datastore.update_document
            params:
              collection: content-review
              documentId: "${inputs.content}"
              data: '{"status": "rejected", "reviewer": "manual"}'
            errorStrategy:
              type: skip
              reason: 状态更新失败不影响审核流程
    else:
      - id: auto-approve
        name: 自动通过
        type: tool
        toolId: builtin.datastore.update_document
        params:
          collection: content-review
          documentId: "${inputs.content}"
          data: '{"status": "approved", "reviewer": "auto"}'
        errorStrategy:
          type: skip
          reason: 状态更新失败不影响审核流程

  - id: generate-report
    name: 生成审核报告
    type: llm
    scene: workflow
    prompt: |
      请根据以下审核信息生成简洁的审核报告：

      ## 内容信息
      - 作者：${inputs.author}
      - 类型：${inputs.contentType}

      ## LLM 风险分析结果
      ${steps.llm-risk-analysis.output.result}

      ## 关键词扫描结果
      ${steps.keyword-scan.output.result}

      请输出：
      1. 审核结论
      2. 风险点汇总
      3. 处理建议
    dependsOn:
      - risk-decision

  - id: send-notification
    name: 发送审核通知
    type: tool
    toolId: builtin.interact.notify
    params:
      channel: webhook
      title: "内容审核完成"
      body: "${steps.generate-report.output.result}"
      recipient: "${inputs.author}"
    dependsOn:
      - generate-report
    errorStrategy:
      type: retry
      maxAttempts: 3
      initialDelayMs: 1000
      maxDelayMs: 5000
