id: content-review
name: 智能内容审核
description: 对提交的内容进行多维度风险分析，高风险内容进入人工审批，低风险自动通过
version: "1.0"
triggers:
  - type: event
    eventType: content.submitted
  - type: manual
inputs:
  content:
    type: string
    required: true
    description: 待审核的内容
  author:
    type: string
    required: false
    defaultValue: unknown
    description: 内容作者
metadata:
  category: 内容安全
  complexity: advanced
steps:
  - id: preprocess
    name: 内容预处理
    type: llm
    scene: knowledge_extraction
    capability: CHAT
    prompt: |
      请对以下内容进行预处理（去HTML标签、规范化格式）：

      ${inputs.content}

      直接输出处理后的内容。

  - id: risk-analysis
    name: 风险分析
    type: llm
    scene: agent_reasoning
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "riskLevel": { "type": "string" },
          "riskScore": { "type": "number" },
          "categories": { "type": "array" }
        },
        "required": ["riskLevel", "riskScore", "categories"]
      }
    prompt: |
      分析以下内容的风险等级：

      ${steps.preprocess.output.result}

      输出 JSON：
      {"riskLevel": "high|medium|low", "riskScore": 0-100, "categories": ["风险类别"]}
    dependsOn:
      - preprocess

  - id: decision
    name: 风险判定
    type: condition
    condition: "${steps.risk-analysis.output.result.riskLevel} == 'high'"
    dependsOn:
      - risk-analysis
    then:
      - id: approval
        name: 人工审批
        type: approval
        message: |
          内容审核审批请求：
          - 作者：${inputs.author}
          - 风险等级：${steps.risk-analysis.output.result.riskLevel}
          - 风险评分：${steps.risk-analysis.output.result.riskScore}
        approvers:
          - admin
        timeoutSeconds: 86400
        autoApproveOnTimeout: false
      - id: handle-approval
        name: 处理审批结果
        type: condition
        condition: "${steps.approval.approval.decision} == 'APPROVED'"
        dependsOn:
          - approval
        then:
          - id: approve-log
            name: 记录审批通过
            type: noop
        else:
          - id: reject-log
            name: 记录审批拒绝
            type: noop
    else:
      - id: auto-pass
        name: 自动通过
        type: noop

  - id: generate-report
    name: 生成审核报告
    type: llm
    scene: document_summary
    capability: CHAT
    prompt: |
      生成内容审核报告：
      - 作者：${inputs.author}
      - 风险等级：${steps.risk-analysis.output.result.riskLevel}
    dependsOn:
      - decision

  - id: notify-result
    name: 通知审核结果
    type: notify
    targetUserId: "${inputs.author}"
    content: |
      您的内容已审核完成。

      审核结果：${steps.risk-analysis.output.result.riskLevel}
    contentType: TEXT
    urgency: LOW
    dependsOn:
      - generate-report
    errorStrategy:
      type: skip
      reason: 通知失败不影响审核完成
