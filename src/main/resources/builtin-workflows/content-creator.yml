id: content-creator
name: 内容创作助手
description: 根据主题和风格要求，搜索素材、生成大纲、撰写正文，支持多种内容类型
version: "1.0"
triggers:
  - type: manual
inputs:
  topic:
    type: string
    required: true
    description: 创作主题
  contentType:
    type: string
    required: false
    defaultValue: article
    description: 内容类型（article/summary/tutorial/review）
  style:
    type: string
    required: false
    defaultValue: 专业但易懂
    description: 写作风格描述
  wordCount:
    type: string
    required: false
    defaultValue: "1500"
    description: 目标字数
metadata:
  category: 内容创作
  complexity: intermediate
steps:
  - id: gather-material
    name: 搜索素材
    type: tool
    toolId: builtin.web.search
    params:
      query: "${inputs.topic}"
      maxResults: "8"
    errorStrategy:
      type: skip
      reason: 无网络素材时仍可基于 LLM 知识创作

  - id: search-notes
    name: 搜索相关笔记
    type: skill
    skillId: memory
    params:
      operation: search
      query: "${inputs.topic}"
      limit: "5"
    errorStrategy:
      type: skip
      reason: 无相关笔记时跳过

  - id: generate-outline
    name: 生成大纲
    type: llm
    scene: agent_reasoning
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "title": { "type": "string" },
          "sections": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "heading": { "type": "string" },
                "keyPoints": { "type": "array", "items": { "type": "string" } }
              }
            }
          }
        },
        "required": ["title", "sections"]
      }
    prompt: |
      为以下创作任务生成大纲：

      主题：${inputs.topic}
      类型：${inputs.contentType}
      风格：${inputs.style}
      目标字数：${inputs.wordCount}

      参考素材：
      ${steps.gather-material.output.result}

      个人笔记：
      ${steps.search-notes.output.result}

      输出 JSON：{"title": "标题", "sections": [{"heading": "章节标题", "keyPoints": ["要点"]}]}
    dependsOn:
      - gather-material
      - search-notes

  - id: check-outline-quality
    name: 大纲质量判断
    type: llm
    scene: agent_reasoning
    capability: STRUCTURED_OUTPUT
    outputSchema: |
      {
        "type": "object",
        "properties": {
          "sectionCount": { "type": "number" },
          "isComplex": { "type": "boolean" }
        },
        "required": ["sectionCount", "isComplex"]
      }
    prompt: |
      分析以下大纲的复杂度：

      ${steps.generate-outline.output.result}

      如果章节数 > 5 或总要点数 > 15，判定为复杂。

      输出 JSON：{"sectionCount": 章节数, "isComplex": true/false}
    dependsOn:
      - generate-outline

  - id: route-writing
    name: 选择写作策略
    type: condition
    condition: "${steps.check-outline-quality.output.result.isComplex} == true"
    dependsOn:
      - check-outline-quality
    then:
      - id: write-detailed
        name: 分段精写
        type: llm
        scene: agent_reasoning
        capability: CHAT
        prompt: |
          请根据以下大纲，逐章节详细撰写内容：

          ${steps.generate-outline.output.result}

          写作要求：
          - 风格：${inputs.style}
          - 目标字数：${inputs.wordCount}
          - 每个章节独立成段，过渡自然
          - 适当引用素材中的数据和观点

          素材参考：
          ${steps.gather-material.output.result}
    else:
      - id: write-concise
        name: 一次成文
        type: llm
        scene: agent_reasoning
        capability: CHAT
        prompt: |
          请根据以下大纲撰写内容：

          ${steps.generate-outline.output.result}

          写作要求：
          - 风格：${inputs.style}
          - 目标字数：${inputs.wordCount}
          - 结构清晰，语言流畅

          素材参考：
          ${steps.gather-material.output.result}

  - id: save-content
    name: 保存创作内容
    type: skill
    skillId: memory
    params:
      operation: save
      content: "${steps.generate-outline.output.result.title}\n\n${steps.route-writing.output.result}"
      tags: "content-creator,${inputs.contentType},${inputs.topic}"
      importance: medium
    dependsOn:
      - route-writing
    errorStrategy:
      type: skip
      reason: 保存失败不影响通知

  - id: notify-done
    name: 通知创作完成
    type: notify
    targetUserId: owner
    content: |
      ✍️ 内容创作完成：${steps.generate-outline.output.result.title}

      类型：${inputs.contentType} | 风格：${inputs.style}
    contentType: MARKDOWN
    urgency: LOW
    dependsOn:
      - save-content
    errorStrategy:
      type: skip
