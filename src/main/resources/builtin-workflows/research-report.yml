id: research-report
name: 调研报告
description: 手动触发，输入调研主题，自动搜索信息并生成调研报告
version: "1.0"
triggers:
  - type: manual
inputs:
  topic:
    type: string
    required: true
    description: 调研主题
  depth:
    type: string
    required: false
    defaultValue: "standard"
    description: 调研深度（brief / standard / deep）
steps:
  - id: search-info
    name: 搜索相关信息
    type: tool
    toolId: web.search
    params:
      query: "${inputs.topic}"
  - id: generate-report
    name: 生成调研报告
    type: llm
    scene: workflow
    prompt: |
      请根据以下搜索结果，针对主题「${inputs.topic}」生成一份调研报告。
      调研深度：${inputs.depth}

      ## 搜索结果
      ${steps.search-info.output.result}

      报告格式：
      1. **概述**：主题背景和调研目的
      2. **核心发现**：按重要性排列的关键发现
      3. **详细分析**：对核心发现的深入分析
      4. **结论与建议**：总结和可行建议
      5. **参考来源**：列出信息来源
