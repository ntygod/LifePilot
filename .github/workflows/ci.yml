name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Run backend tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zhiwei-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: zhiwei-web
        run: npm ci

      - name: Run frontend tests
        working-directory: zhiwei-web
        run: npm run test:run

      - name: Build frontend
        working-directory: zhiwei-web
        run: npm run build
