services:
  backend:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - zhiwei-data:/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ZHIWEI_DATA_DIR=/data
    restart: unless-stopped

  frontend:
    build: ./zhiwei-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  zhiwei-data:
