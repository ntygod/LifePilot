services:
  backend:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - lifepilot-data:/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LIFEPILOT_DATA_DIR=/data
    restart: unless-stopped

  frontend:
    build: ./lifepilot-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lifepilot-data:

